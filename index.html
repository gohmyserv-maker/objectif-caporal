<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Objectif Caporal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a3a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : appli mobile une colonne (max 640px), barre d'en-tête marine à bande rétro-réfléchissante, barre d'onglets basse à 5 entrées, écrans de séance en plein écran avec bouton retour */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --sunk:#e7e9e5; --fg:#18212c; --muted:#56606d; --line:#d3d7d1;
  --navy:#1d2a3a; --on-navy:#f3f5f7; --on-navy-muted:#b4bfcb; --red:#c3261c; --red-ink:#a81f17; --red-soft:#f8e2df; --hi:#e3c200; --silver:#b9bfc4;
  --navy-2:#26405f; --steel:#4f6378; --c-cmd:#26405f; --c-inc:#c3261c; --c-lspcc:#d9730d; --c-ari:#4f6378; --ok:#1d7346; --ok-soft:#ddf0e4; --ko:#b0241c; --ko-soft:#f7e0dd; --warn:#8a5f00; --warn-soft:#f5ebcb; --rest:#5b6b7d;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --navh:64px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19202a; --sunk:#0c1015; --fg:#e9ecef; --muted:#a1abb7; --line:#2b3542;
  --navy:#0a0f15; --on-navy:#eef1f4; --on-navy-muted:#97a3b0; --red:#f0604f; --red-ink:#ff8576; --red-soft:#3b1f1c; --hi:#f0d43a; --silver:#59636e;
  --navy-2:#3a5d86; --steel:#6d8399; --c-cmd:#4f7cb3; --c-inc:#f0604f; --c-lspcc:#f0913a; --c-ari:#8aa0b6; --ok:#62c98f; --ok-soft:#163224; --ko:#f2837a; --ko-soft:#3b1f1d; --warn:#e6b84a; --warn-soft:#342b13; --rest:#8796a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19202a; --sunk:#0c1015; --fg:#e9ecef; --muted:#a1abb7; --line:#2b3542;
  --navy:#0a0f15; --on-navy:#eef1f4; --on-navy-muted:#97a3b0; --red:#f0604f; --red-ink:#ff8576; --red-soft:#3b1f1c; --hi:#f0d43a; --silver:#59636e;
  --navy-2:#3a5d86; --steel:#6d8399; --c-cmd:#4f7cb3; --c-inc:#f0604f; --c-lspcc:#f0913a; --c-ari:#8aa0b6; --ok:#62c98f; --ok-soft:#163224; --ko:#f2837a; --ko-soft:#3b1f1d; --warn:#e6b84a; --warn-soft:#342b13; --rest:#8796a8; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
/* en-tête */
.top{background:var(--navy);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px}
.top h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--on-navy);display:grid;place-items:center;border-radius:50%;cursor:pointer}
.top .back:active{background:rgba(255,255,255,.12)}
.top .tag{font-family:var(--mono);font-size:12px;color:var(--on-navy-muted);letter-spacing:.06em;white-space:nowrap}
.stripe{height:10px;background:linear-gradient(var(--hi) 0 3px,var(--silver) 3px 7px,var(--hi) 7px 10px)}
main{padding-block:18px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px))}
.screen{display:grid;gap:16px}
/* barre basse */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding-inline:2px}
nav.bar button{min-height:var(--navh);border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:3px;font:600 11.5px var(--body);letter-spacing:.02em;cursor:pointer;border-radius:10px;transition:background-color .12s}
nav.bar button:active{background:var(--sunk)}
nav.bar button[aria-current="page"]{color:var(--red-ink)}
nav.bar svg{width:24px;height:24px}
body.session nav.bar{display:none}
body.session main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
/* typographie */
h2 .chv{display:inline-block;width:18px;height:12px;margin-right:8px;vertical-align:2px;color:var(--red)}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:20px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15;text-wrap:balance}
h4{font-size:16px;margin:14px 0 4px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.lbl{font-family:var(--body);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
/* boutons */
.btn{min-height:48px;font:600 16px var(--body);border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;cursor:pointer;transition:background-color .12s,transform .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a0b09}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0b09}}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default;transform:none}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* héros */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:20px 18px 0;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:6px 12px;align-items:center;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),radial-gradient(120% 90% at 100% 0%,rgba(195,38,28,.45),transparent 60%)}
.hero .tape{grid-column:1/-1;height:18px;margin:14px -18px 0;background:linear-gradient(var(--hi) 0 6px,var(--silver) 6px 12px,var(--hi) 12px 18px)}
.hero .goal{font:600 13px var(--body);color:var(--on-navy-muted);margin-top:8px}
.hero .goal b{color:#fff}
.insig{width:104px;display:grid;justify-items:center;gap:4px;text-align:center}
.insig svg{width:88px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.insig .v{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:#fff}
.insig .v small{display:block;font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-muted);margin-top:3px}
.chev-fill{animation:chevIn 1.1s var(--out) both}
@keyframes chevIn{from{transform:scaleX(var(--f0,0))}}
.hero .jx{font-family:var(--display);font-weight:800;font-size:78px;letter-spacing:-.01em;line-height:.85;font-variant-numeric:tabular-nums;color:#fff}
.hero .jx small{font-size:20px;color:var(--on-navy-muted);margin-left:6px;font-weight:700}
.hero .ph{display:inline-block;font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:var(--hi);padding:3px 8px;border-radius:4px;margin-left:8px;vertical-align:4px}
.hero .meta{font-size:14px;color:var(--on-navy-muted)}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:#fff}
.ring .v small{display:block;font:500 10px var(--mono);letter-spacing:.08em;color:var(--on-navy-muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1;margin-top:8px}
.stats div{background:rgba(255,255,255,.08);border-radius:6px;padding:9px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.stats b{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;color:#fff}
.stats span{font-size:12px;color:var(--on-navy-muted)}
/* étapes de séance */
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;min-height:72px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:background-color .12s}
.step:active{background:var(--sunk)}
.step:disabled{opacity:.5;cursor:default}
.step .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tc,var(--sunk));color:var(--tci,#fff);box-shadow:0 3px 8px color-mix(in srgb,var(--tc,#000) 30%,transparent)}
.step[data-task=learn]{--tc:var(--red)}.step[data-task=cards]{--tc:var(--navy-2)}.step[data-task=quiz]{--tc:var(--hi);--tci:#1d2a3a}.step[data-task=oral]{--tc:var(--steel)}.step[data-task=exam]{--tc:var(--navy-2)}
.step.done .ic{--tc:var(--ok);--tci:#fff}
.step .ic svg{width:22px;height:22px}
.step.done .ic{background:var(--ok-soft);color:var(--ok)}
.step .t{font-weight:700;display:block}
.step .d{font-size:14px;color:var(--muted);display:block}
.step .go{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.step.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--fg);letter-spacing:.02em}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.banner{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;background:var(--warn-soft);color:var(--fg);padding:12px 14px;border-radius:var(--r);font-size:15px}
.banner svg{width:20px;height:20px;color:var(--warn);margin-top:1px}
/* maîtrise */
.mod .dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--mc);margin-right:8px;vertical-align:1px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 96px 46px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mod:last-child{border-bottom:0}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.mid{background:var(--warn)} .meter i.low{background:var(--ko)}
.pct{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
/* programme */
.week{display:grid;gap:6px}
.wk{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.day{display:grid;grid-template-columns:54px minmax(0,1fr) 28px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:56px;position:relative}
.day .dt::before{content:"";display:block;width:18px;height:4px;border-radius:2px;background:var(--ph,var(--line));margin-bottom:6px}
.day.learn{--ph:var(--red)} .day.cons{--ph:var(--warn)} .day.final{--ph:var(--hi)} .day.rest{--ph:var(--line);background:transparent} .day.exam{--ph:var(--hi);background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.day.today{outline:2px solid var(--fg);outline-offset:1px}
.day .dt{font-family:var(--mono);font-size:12px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.day .dt b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);line-height:1}
.day.exam .dt,.day.exam .dt b{color:var(--on-navy)}
.day .c{font-size:14px;min-width:0}
.day .c b{font-size:14.5px}
.day .st{width:24px;height:24px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* fiches */
details.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--mc);color:#fff;flex:none}
.mico svg{width:22px;height:22px}
details.fiche>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:64px}
details.fiche>summary::-webkit-details-marker{display:none}
details.fiche>summary .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;display:block}
details.fiche[open]>summary{border-bottom:1px solid var(--line)}
.fbody{padding:4px 16px 16px;min-width:0}
.fbody ul,.fbody ol,.reader ul,.reader ol{padding-left:22px;margin:4px 0 10px}
.fbody li,.reader li{margin:3px 0}
.tbl{overflow-x:auto;margin:6px 0 12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmd{border:1px solid var(--line);background:var(--sunk);padding:10px 12px;border-radius:6px;margin:6px 0 10px;font-family:var(--mono);font-size:14px;line-height:1.5}
.cmd b{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.alert{background:var(--red-soft);color:var(--fg);padding:10px 12px;border-radius:6px;margin:8px 0 12px;font-size:15px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 30%,transparent)}
.note{background:var(--sunk);padding:10px 12px;border-radius:6px;margin:8px 0 12px;font-size:14.5px;color:var(--muted)}
.mn{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.06em;color:var(--red-ink)}
.foot{font-size:13px;color:var(--muted)}
.chunkline{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;font-size:15px;padding:6px 0}
/* lecteur */
.reader{font-size:17px;line-height:1.6}
.reader.hide .rbody{filter:blur(7px);user-select:none;pointer-events:none}
.rbody{transition:filter .2s}
.sticky-cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;grid-template-columns:1fr 1fr;padding-top:8px}
/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px}
.qtext{font-size:19px;font-weight:600;line-height:1.4;margin:10px 0 14px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;font-size:16px;min-height:56px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center;transition:background-color .12s}
.opt:active{background:var(--sunk)}
.opt .k{font-family:var(--mono);color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--ko-soft);border-color:var(--ko)}
.opt.pick{border-color:var(--fg);background:var(--sunk)}
.expl{margin-top:12px;padding:12px;border-radius:6px;background:var(--sunk);font-size:15px}
.progress{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--red);transition:width .25s}
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
/* cartes */
.flash{min-height:240px;display:grid;align-content:center;gap:12px;text-align:center;padding:26px 18px;cursor:pointer}
.flash .front{font-size:19px;font-weight:600}
.flash .back{font-size:17px;border-top:1px dashed var(--line);padding-top:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;font-size:14px;padding:8px 4px;min-height:60px}
.grades .btn small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.g1{border-color:var(--ko)!important;color:var(--ko)!important}.g4{border-color:var(--ok)!important;color:var(--ok)!important}
/* oral */
.timer{font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.check{display:grid;gap:4px;margin:8px 0}
.check label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer;min-height:44px;padding:6px 0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--red)}
/* réglages */
.field{display:grid;gap:6px}
.field label,.field .lbl2{font-weight:600}
.field .hint{font-size:14px;color:var(--muted)}
input[type=date],textarea{font:inherit;min-height:48px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
textarea{min-height:110px;font-family:var(--mono);font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:52px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);animation:toastIn .28s var(--out);box-shadow:0 6px 20px rgba(10,15,21,.25);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:380px){.hero .jx{font-size:62px}.hero{grid-template-columns:minmax(0,1fr) 86px}.insig{width:86px}.insig svg{width:72px}.mod{grid-template-columns:minmax(0,1fr) 70px 42px}}

/* ===== matière et mouvement : bande rétro-réfléchissante qui accroche la lumière ===== */
:root{--out:cubic-bezier(.16,1,.3,1);--fast:140ms;--mid:240ms;--slow:420ms}
::selection{background:color-mix(in srgb,var(--hi) 55%,transparent);color:var(--fg)}
input,textarea{caret-color:var(--red)}
html{scrollbar-color:var(--silver) transparent;accent-color:var(--red)}
.btn,.step,.opt,nav.bar button,.seg button,details.fiche>summary{transition:transform var(--fast) var(--out),background-color var(--fast),border-color var(--fast),box-shadow var(--mid)}
.btn:active,.seg button:active{transform:scale(.97)}
.step:active,.opt:active{transform:scale(.985)}
nav.bar button svg{transition:transform var(--mid) var(--out)}
nav.bar button[aria-current="page"] svg{transform:translateY(-2px)}

F.explo = `
<h3>Composition de l'air</h3>
<p>Azote <b>78 %</b>, oxygène <b>21 %</b>, autres gaz <b>moins de 1 %</b>.</p>
<h3>Définitions</h3>
<ul>
<li><b>Explosion</b> : réaction violente de combustion qui engendre une surpression.</li>
<li><b>Explosibilité</b> : un gaz inflammable dans l'air rend l'atmosphère explosible. Le mélange n'est pas forcément explosif.</li>
<li><b>Explosivité</b> : le mélange air/gaz est dans la bonne proportion, l'atmosphère est explosive.</li>
<li><b>LIE</b>, limite inférieure d'explosivité : concentration minimale, en % du volume d'air, au-dessus de laquelle le gaz peut s'enflammer. En dessous, mélange trop pauvre.</li>
<li><b>LSE</b>, limite supérieure d'explosivité : concentration maximale en dessous de laquelle il peut s'enflammer. Au-dessus, il manque le comburant.</li>
</ul>
<div class="tbl"><table><thead><tr><th>Concentration</th><th>État</th></tr></thead><tbody>
<tr><td>Sous la LIE</td><td>Pas assez de gaz. Atmosphère explosible.</td></tr>
<tr><td>Entre LIE et LSE</td><td><b style="color:var(--red)">Atmosphère explosive : DANGER</b></td></tr>
<tr><td>Au-dessus de la LSE</td><td>Trop de gaz. Atmosphère explosible : une dilution (ventilation, ouverture) la fait repasser dans la plage explosive.</td></tr>

<p><b>Explosimètre</b> : mesure de 0 à 100 % de la LIE. <b>Catharomètre</b> : mesure le pourcentage de gaz dans le volume, au-delà de la LIE.</p>
<h3>Densité : où chercher le gaz</h3>
<ul><li>Air = densité 1.</li><li>Densité supérieure à 1 : le gaz est en <b>partie basse</b>. Relevés dans les sous-sols, égouts.</li><li>Densité inférieure à 1 : le gaz est en <b>partie haute</b>. Relevés au-dessus des faux plafonds.</li><li>Densité égale à 1 : mélange homogène.</li></ul>

<h3>Équipements</h3>

<p>Le choix du méthane comme gaz étalon renforce la sécurité du personnel, en raison de la valeur de sa LIE. En sous-oxygénation, la lecture explo n'est plus fiable.</p>

<h3>Le méthane (CH₄), gaz naturel</h3>
<div class="tbl"><table><thead><tr><th>Gaz</th><th>État</th><th>Densité</th><th>LIE / LSE</th></tr></thead><tbody>

<ul><li>Le gaz naturel est un mélange composé <b>principalement de méthane</b>.</li><li>Inodore à l'état naturel : il est <b>odorisé au THT</b> (tétrahydrothiophène) avant distribution.</li><li>Plus léger que l'air : il monte et s'accumule en <b>partie haute</b> (faux plafonds, combles).</li><li>Inflammable et explosif entre <b>5 % et 15 %</b> dans l'air. Au-dessus de la LSE, le mélange est trop riche, mais <b>pas sûr</b> : une dilution le ramène dans la plage explosive.</li><li>Non toxique, mais <b>asphyxiant</b> à forte concentration (il chasse l'oxygène).</li><li>C'est le <b>gaz étalon</b> de l'Altair 4X en Haute-Saône.</li></ul>

<h3>À quoi elle sert</h3>
<p>La caméra thermique capte l'infrarouge émis par les surfaces et en fait une image. Elle part à chaque départ incendie et sert <b>dès la reconnaissance</b> :</p>
<ul>

<p>FLIR ne référence pas de modèle « E3 » dans sa gamme. La caméra de ton CIS est probablement une <b>Ex</b> (E4, E5, E6, E8) ou une <b>E30</b>. C'est une caméra de diagnostic, pas d'attaque : elle ne tient ni la chaleur ni l'engagement dans un volume en feu.</p>

F.risque = `
<h3>Triangle du feu</h3>
<p>Combustible, comburant, énergie d'activation. Les trois sont interdépendants : en retirer un arrête la combustion.</p>
<h3>Les 3 modes de propagation</h3>
<ul><li><b>Conduction</b> : de proche en proche dans le matériau lui-même.</li><li><b>Convection</b> : par un fluide en mouvement, les fumées.</li><li><b>Rayonnement</b> : par ondes électromagnétiques, sans contact matériel.</li></ul>
<h3>Puissance</h3><p>Énergie thermique (joule) dégagée par unité de temps (seconde). Unité : le <b>watt</b>, 1 W = 1 J/s.</p>
<h3>Les fumées</h3>
<p>Gaz : CO₂, CO, vapeur d'eau, et d'autres selon les matériaux qui brûlent.</p>
<p><b>Dangers</b> : inflammabilité, explosivité, toxicité et corrosivité, envahissement et frein à la mobilité, particules, opacité, rayonnement, chaleur.</p>
<h3>Lecture du feu</h3>
<div class="tbl"><table><thead><tr><th>Je lis</th><th>Les fumées sont</th></tr></thead><tbody>
<tr><td><b>F</b>umée</td><td><b>C</b>haudes</td></tr><tr><td><b>F</b>lamme</td><td><b>O</b>paques</td></tr><tr><td><b>C</b>haleur</td><td><b>M</b>obiles</td></tr><tr><td><b>O</b>uvertures</td><td><b>I</b>nflammables</td></tr><tr><td><b>S</b>ons</td><td>e<b>X</b>plosives</td></tr>
</tbody></table></div>
<p>Moyen mnémotechnique des fumées : <span class="mn">C.O.M.I.X</span></p>
<h3>Phases de développement</h3>
<ol><li><b>Feu naissant</b></li><li><b>Feu croissant</b> : FLC, feu limité par le combustible.</li><li><b>Flashover</b>, puis <b>feu pleinement développé</b> : FLV, feu limité par la ventilation.</li><li><b>Déclin</b> : FLC, épuisement du combustible.</li></ol>
<p>Cas du <b>confinement</b> (FLV) : le feu décline par manque d'O₂. Une <b>rupture de confinement</b> le relance brutalement.</p>
<h3>Les 3 phénomènes thermiques</h3>
<div class="tbl"><table><thead><tr><th></th><th>Flashover</th><th>Backdraft</th><th>FGI</th></tr></thead><tbody>
<tr><td><b>Nom</b></td><td>Embrasement généralisé éclair</td><td>Explosion de fumées</td><td>Fire Gas Ignition, inflammation des gaz d'incendie</td></tr>
<tr><td><b>Déclencheur</b></td><td>Gaz combustibles + énergie suffisante + veine d'air maintenue</td><td><b>Apport de comburant</b></td><td><b>Apport d'énergie d'activation</b></td></tr>
<tr><td><b>Volume</b></td><td>Ventilé</td><td>Clos, sous-ventilé</td><td>Volumes adjacents, couloirs, vides, conduits</td></tr>
</tbody></table></div>
<h4>Flashover</h4>
<p>Passage brutal d'un feu localisé à l'embrasement de tous les combustibles du volume.</p>
<ul><li>Fumées sur plus de la moitié de la hauteur, plafond de fumées qui s'épaissit et s'assombrit vers le noir.</li><li>Suies noires : indicateur de flammes dans le volume.</li><li>Convection importante. Écoulement d'air vers l'intérieur en partie basse de l'ouvrant : le feu « respire ».</li><li>Maintenir l'ouvrant ouvert accélère le flash.</li></ul>
<h4>Backdraft</h4>
<p>Feu sous-ventilé en volume clos. Un apport d'air soudain (fenêtre qui casse, porte ouverte sans précaution, toiture qui cède) réactive une flamme qui fait exploser les fumées. Exemple vidéo : environ 40 s après l'ouverture de la porte.</p>
<p><b>Signes annonciateurs</b> :</p>
<ul><li>Fumées épaisses accumulées jusqu'au sol, couleur claire brun ou jaune : chargées en gaz de pyrolyse.</li><li>Vitres noircies, dépôts huileux sur les parois.</li><li>Fumées qui sortent par les interstices et le bas des portes, rapidement et sous pression.</li><li><b>Pulsations</b> : la fumée sort puis l'air rentre, parfois audible.</li><li>Sons assourdis, aucune flamme visible, chaleur perceptible.</li></ul>
<p>Risque accru dans les bâtiments basse consommation, bien isolés, à double ou triple vitrage : les indices de chaleur y sont moins visibles.</p>
<h4>FGI</h4>
<p>Accumulation de fumées riches en imbrûlés ou en gaz de pyrolyse, qui s'enflamme au contact d'une source de chaleur. Possible avec des <b>fumées froides</b>.</p>
<ul><li><b>Flash fire</b> : le front de flamme ne génère pas d'onde de pression.</li><li><b>Smoke explosion</b> : le front de flamme génère une onde de pression.</li></ul>
<p>Lieux : couloirs adjacents, vides, conduits, cages d'escalier ou d'ascenseur, faux plafonds, grands volumes. Les fumées y sont parfois plus claires et donnent de faux indices sur l'emplacement du foyer. Source d'ignition : le feu, un appareil électrique, un débris braisant au déblai.</p>
<div class="tbl"><table><thead><tr><th>Type de gaz</th><th>Conduite à tenir</th></tr></thead><tbody>
<tr><td>Résidus de combustion, qui exigent une haute température pour s'enflammer</td><td>Refroidir les fumées au moyen hydraulique pour sécuriser la zone</td></tr>
<tr><td>Gaz de pyrolyse, qui s'enflamment à basse température</td><td>Le refroidissement ne suffit pas : <b>seule la ventilation opérationnelle</b> sécurise la zone</td></tr>
</tbody></table></div>
<h3>Comportement des structures</h3>
<div class="tbl"><table><thead><tr><th>Résistance</th><th>Réaction au feu</th><th>Exemple</th></tr></thead><tbody>
<tr><td>Bonne</td><td>Faible</td><td>Béton, brique, pierre</td></tr><tr><td>Mauvaise</td><td>Faible</td><td>Bâtiments métalliques : s'affaissent vite</td></tr><tr><td>Bonne</td><td>Importante</td><td>Lamellé-collé, panneaux sandwich</td></tr><tr><td>Mauvaise</td><td>Importante</td><td>Bois non traité, bâtiments précaires</td></tr>
</tbody></table></div>
<p>ERP et code du travail : stabilité au feu minimale de <b>30 min</b>. Les ERP disposent d'<b>EAS</b>, espaces d'attente sécurisés.</p>
<p><b>Modèle de Thomas</b> : décrit à la fois les transferts de chaleur, les transferts de masse et la propagation dans le local. Zone gazeuse chaude en haut, air frais entrant en partie basse.</p>`;

F.ech = `
<h3>Les 6 établissements types</h3>
<ol><li><b>ETB-1</b> : lance en eau du dévidoir tournant (LDT)</li><li><b>ETB-2</b> : division d'alimentation ou division d'attaque (en prolongement)</li><li><b>ETB-3</b> : ligne d'attaque sur une prise d'eau</li><li><b>ETB-4</b> : alimentation d'un dispositif hydraulique</li><li><b>ETB-5</b> : établissements particuliers (lance mousse avec injecteur mobile, queue de paon, lance canon)</li><li><b>ETB-6</b> : prolongation d'établissement ou remplacement de tuyau</li></ol>
<h3>ETB-1 : LDT</h3>
<p>40 m de tuyau semi-rigide de Ø 23 mm. Établissement direct du point d'eau au point d'attaque.</p>
<div class="cmd"><b>Préparatoire</b>« BAT ! Pour l'établissement de la lance du dévidoir tournant, en reconnaissance »<b>Exécution</b>« Point d'attaque… Accès… Mission… Établissez ! »</div>
<div class="tbl"><table><thead><tr><th>Chef d'équipe</th><th>Équipier</th></tr></thead><tbody>
<tr><td>Se munit de son matériel de base</td><td>Se munit de son matériel de base</td></tr>
<tr><td>Prend la lance</td><td>Déroule le dévidoir jusqu'au premier raccord</td></tr>
<tr><td>Fait une réserve de 2 à 3 tours sur l'épaule, suit le CA</td><td>Prend le raccord et suit le CE jusqu'au point d'attaque</td></tr>
<tr><td></td><td>Pose le raccord au pied du chef et le double</td></tr>
</tbody></table></div>
<h3>ETB-2 : division d'alimentation (DAL)</h3>
<div class="cmd"><b>Préparatoire</b>« BAL ! Pour l'établissement d'une division d'alimentation, en reconnaissance »<b>Exécution</b>« Prise d'eau… Point d'attaque… Accès… Mission… Établissez ! »</div>
<ul><li>CE et équipier tirent la division en suivant le CA.</li><li>Ils posent la division au sol et se positionnent pour ouvrir l'eau ou répercuter l'ordre d'ouvrir.</li><li>Le conducteur aide en connectant le demi-raccord à la pompe.</li></ul>
<div class="alert">Engin à moins de 20 m : le conducteur peut établir seul la DAL. L'emploi du dévidoir se fait sur ordre du chef d'agrès.</div>
<h3>ETB-2 : division d'attaque (DAT)</h3>
<div class="cmd"><b>Préparatoire</b>« BAL ! Pour l'établissement d'une division d'attaque, en reconnaissance »<b>Exécution</b>« Une division d'attaque, emplacement… Prise d'eau… Établissez ! »</div>
<ol><li>CE : se munit de son matériel de base et suit le CA jusqu'à l'emplacement de la DAT.</li><li>CE : pose et amarre la division.</li><li>CE et équipier se rendent à la prise d'eau, ajustent le placement des tuyaux, s'arrêtent à chaque demi-raccord et interconnectent les tuyaux.</li><li>Raccordement à la prise d'eau et ouverture.</li><li>Compte rendu au CA.</li></ol>
<div class="alert">Si le CA se trouve dans les étages, le BAL remonte <b>systématiquement</b> avec une ligne d'attaque.</div>
<h3>ETB-3 : LAT sur prise d'eau</h3>
<p>Une prise d'eau peut être : un fourgon, une DAL, une DAT, une colonne sèche.</p>
<div class="cmd"><b>Préparatoire</b>« BAT ! Pour l'établissement d'une ligne d'attaque, en reconnaissance »<b>Exécution</b>« Prise d'eau… Point d'attaque… Accès… Mission… Établissez ! »</div>
<div class="tbl"><table><thead><tr><th>Chef d'équipe</th><th>Équipier</th></tr></thead><tbody>
<tr><td>Se munit de son matériel de base</td><td>Se munit de son matériel de base</td></tr>
<tr><td>Raccorde le tuyau de l'équipier à la prise d'eau</td><td>Suit le CA jusqu'au point d'attaque</td></tr>
<tr><td>Suit l'équipier en ajustant les tuyaux</td><td></td></tr>
<tr><td>Pose son tuyau et réalise les branchements</td><td></td></tr>
<tr><td>Ordonne l'ouverture de l'eau</td><td>Ouvre ou répercute l'ordre</td></tr>
<tr><td></td><td>Vient doubler le chef</td></tr>
</tbody></table></div>
<h4>Variante feu de GPL</h4>
<div class="cmd"><b>Préparatoire</b>« BAL ! Pour l'établissement d'une LAT, feu de GPL, en reconnaissance »<b>Exécution</b>« Point d'attaque… Prise d'eau… Mission… Accès… Établissez ! »</div>
<ul><li>CE : pose son tuyau en « O » et réalise les branchements.</li><li>Équipier : pose ses tuyaux en « Z », les transforme en « O » et réalise les branchements, donne le demi-raccord au conducteur, puis vient doubler le chef.</li><li>Ouverture de l'eau sur ordre.</li></ul>
<p>La distance de sécurité de <b>50 m</b> demande un gros effort pour tirer les tuyaux. Transformer les « Z » en « O » donne un effet ressort qui facilite la progression du binôme.</p>
<h4>Dispositif complet : LAT sur DAT sur DAL</h4>
<div class="cmd"><b>Préparatoire</b>« BAT / BAL en reconnaissance ! Conducteur, vous établirez une division d'alimentation au pied de l'immeuble »<b>Exécution</b>« BAT / BAL halte ! BAL ! Emplacement de la DAT… ! Prise d'eau la DAL ! Établissez ! »<br>« BAT ! Prise d'eau la DAT ! Point d'attaque… ! Établissez ! »</div>
<h3>ETB-4 : alimentation de l'engin</h3>
<p>Alimentation optimisée : <b>1 ligne de 110</b> ou <b>2 lignes de 70</b>.</p>
<div class="tbl"><table><thead><tr><th>Situation</th><th>Qui / avec quoi</th></tr></thead><tbody>
<tr><td>1. Engin au point d'eau ou tout près</td><td>Le conducteur seul, avec 1 tuyau de 110 de 10 m</td></tr>
<tr><td>2. Engin éloigné, alimentable par un établissement de 70</td><td>Le <b>BAL</b>. Matériel BAL : 1 voire 2 dévidoirs, 1 clé de poteau ou de barrage, 1 retenue si bouche d'incendie. Conducteur : 1 collecteur d'alimentation</td></tr>
<tr><td>3. Alimentation classique impossible</td><td>Aspiration (engin ou motopompe), porteur d'eau, noria d'engins pompes, réserve artificielle, ligne via dévidoir automobile</td></tr>
</tbody></table></div>
<h3>ETB-5 : établissements particuliers</h3>
<ul><li><b>Lance mousse avec injecteur mobile</b> : le BAL alimente l'injecteur avec les bidons d'émulseur. Engin équipé du système Caméléon : mêmes règles que l'ETB-3.</li><li><b>Lance queue de paon</b> : mêmes règles que l'ETB-3, seul le matériel change. Chef BAT : la lance + 1 tuyau de 45 plié en Z. Équipier : 2 tuyaux de 45 pliés en Z.</li><li><b>Lance canon</b> : le BAT place la lance au point d'attaque désigné par le CA. Le BAL l'alimente (dévidoir, tuyaux en écheveaux ou couronne).</li></ul>
<h3>ETB-6 : prolongation ou remplacement</h3>
<ul><li>Décidée par le <b>CA en concertation avec le CE</b>.</li><li>Réalisée par l'équipier BAT ou par le BAL.</li><li>La <b>fermeture de l'arrivée d'eau est commandée par le chef d'équipe du binôme d'attaque</b> : c'est sa sécurité et celle de son équipier qui sont en jeu.</li></ul>
<h3>Remplacement d'un tuyau par l'équipier (FTO 6)</h3>
<ul><li><b>Remplacement</b> : anomalie constatée (tuyau percé, demi-raccord défectueux). <b>Prolongement</b> : ajuster la longueur ou déplacer l'établissement.</li><li>Personnel : <b>1 binôme</b> (BAT). La répartition du matériel est décidée par le CA.</li><li>Ordre préparatoire : <b>« Pour le remplacement du tuyau n°…, en avant ou en reconnaissance »</b>.</li><li>Pression maintenue à l'engin <b>sur la division</b>, ou utilisation d'un <b>étrangleur</b>.</li></ul>
<div class="tbl"><table><thead><tr><th>Étape</th><th>Équipier BAT</th><th>Chef d'équipe BAT</th></tr></thead><tbody>
<tr><td class="num">1</td><td style="white-space:normal;font-family:inherit">Déroule un tuyau neuf <b>à côté</b> du tuyau à remplacer</td><td style="white-space:normal;font-family:inherit">Poursuit l'attaque pendant la préparation</td></tr>
<tr><td class="num">2</td><td style="white-space:normal;font-family:inherit">Se rend à la division et <b>prévient le chef d'équipe</b> de la coupure d'eau</td><td style="white-space:normal;font-family:inherit">Est prévenu, se met en sécurité, <b>commande la fermeture</b></td></tr>
<tr><td class="num">3</td><td style="white-space:normal;font-family:inherit">Vérifie que le tuyau <b>n'est plus sous pression</b>, remplace le tuyau</td><td style="white-space:normal;font-family:inherit">Reste en position, sans eau</td></tr>
<tr><td class="num">4</td><td style="white-space:normal;font-family:inherit"><b>Rouvre la division</b> sur ordre du chef d'équipe</td><td style="white-space:normal;font-family:inherit">Ordonne la réouverture, contrôle l'établissement remis en eau</td></tr>
</tbody></table></div>
<div class="note">Danger : pendant la coupure, le binôme reste <b>exposé au feu</b> sans protection hydraulique. D'où la fermeture commandée par le chef d'équipe.</div>`;

F.ext = `
<h3>Les types de jet</h3>
<div class="tbl"><table><thead><tr><th>Jet</th><th>Usage</th><th>À savoir</th></tr></thead><tbody>
<tr><td><b>Droit</b></td><td>Cible à distance (atténuation, attaque massive, ricochet), matériaux fibreux, mouillage et refroidissement</td><td>Consomme beaucoup d'eau. Le débit règle la portée</td></tr>
<tr><td><b>Brisé</b></td><td>Masse d'eau sur des surfaces combustibles sans l'effet cinétique du jet droit</td><td>Diffuseur complètement à droite, robinet très peu ouvert</td></tr>
<tr><td><b>JDA</b> diffusé d'attaque</td><td>Refroidir fumées et gaz chauds, attaque massive, ventiler pour progresser</td><td>Le porte-lance règle débit, angle du cône, angle d'application</td></tr>
<tr><td><b>JDP</b> diffusé de protection</td><td>Protéger le binôme d'un fort rayonnement ou d'un phénomène rapide</td><td>Écran hydraulique, peu d'effet sur le volume gazeux</td></tr>
<tr><td><b>Purge</b></td><td>Refroidir directement les matériaux en feu</td><td>Déblai, faibles débits, limite l'accumulation d'eau</td></tr>
</tbody></table></div>
<h3>Les 8 techniques d'extinction</h3>
<div class="tbl"><table><thead><tr><th>TDE</th><th>Technique</th><th>Jet et réglage</th><th>Débit</th></tr></thead><tbody>
<tr><td class="num">1</td><td><b>Refroidissement des fumées</b> (gas cooling). Baisse la plage d'inflammabilité et le rayonnement. Inconvénient : vapeur</td><td>JDA, impulsions courtes ½ s ×2 ou 3 (petit volume : habitation, hôtel, bureau). Impulsions longues 2 à 5 s (gros volume : entrepôt, garage, magasin)</td><td class="num">100-250<br>100-300 l/min</td></tr>
<tr><td class="num">2</td><td><b>Extinction directe</b> : atteindre le combustible, couper la pyrolyse. Risque de dispersion et dégâts des eaux</td><td><b>Painting</b> : jet droit, zig-zag ou balayage, ouverture partielle, grande surface. <b>Penciling</b> : paquets d'eau, application courte et ciblée. <b>Ricochet</b> : atteindre le feu à distance en sécurité</td><td class="num">Faible, s'adapter</td></tr>
<tr><td class="num">3</td><td><b>Extinction indirecte</b> : produire de la vapeur, atteindre le comburant. Tactique défensive, foyer pas directement accessible</td><td>JDA 20 à 30°, badigeonnage, en sécurité derrière un ouvrant</td><td class="num">100-300 l/min</td></tr>
<tr><td class="num">4</td><td><b>Combinée / attaque massive</b> : effet direct et indirect. Feu pleinement développé, <b>depuis l'extérieur</b>. Risque de propagation vers un volume adjacent si ouvrant</td><td>Jet diffusé en T, Z, O, 8, durée adaptée 5 à 6 s</td><td class="num">S'adapter</td></tr>
<tr><td class="num">5</td><td><b>Situation de pré-backdraft</b> : réduire les signes par inertage</td><td>Indirecte JDA 30°, 1 à 2 s. Ou <b>trouée</b> d'environ 20 × 20 cm (LHP, ou LDV en JDA). Objectif atteint quand fumées et vapeur ne sortent plus en pression</td><td class="num">500 l/min</td></tr>
<tr><td class="num">6</td><td><b>Repli sous protection hydraulique</b> : sauvetage, mise en sécurité du binôme</td><td>JDA si contrainte thermique ou anges danseurs. JDP pour le sauvetage du binôme ou d'une victime en situation dégradée (flashover). Repli sous écran d'eau ou sous impulsions</td><td class="num">500 l/min</td></tr>
<tr><td class="num">7</td><td><b>Feu piloté par le vent</b>, effet chalumeau</td><td>Lire le cheminement de l'air, gérer les ouvrants, ne pas se placer dans le flux, attaquer <b>vent dans le dos</b>. Options : TDE-8 si l'ouvrant est à portée, attaque depuis une pièce de la face exposée au vent, rideau occultant devant les ouvrants</td><td class="num">-</td></tr>
<tr><td class="num">8</td><td><b>Attaque d'atténuation</b> : stopper un feu piloté par le vent ou difficile d'accès (porte blindée). Tactique transitoire</td><td><b>Jet droit au plafond</b> de la pièce, 10 à 15 s. Possible depuis une MEA. Un jet diffusé n'a <b>aucun effet</b></td><td class="num">≥ 250 l/min</td></tr>
</tbody></table></div>
<div class="alert">TDE-8 <b>interdite si un binôme est engagé par l'intérieur</b>.</div>
<h3>Protection du binôme</h3>
<ul><li>Lecture permanente du feu : anges danseurs, roll-over.</li><li>Prévoir un itinéraire de repli et de secours.</li><li>Se replier hors du volume dès que la progression n'est plus sûre.</li><li>Impulsions adaptées, progression au ras du sol, accroupi ou à genoux, en binôme.</li></ul>
<p><b>Repli impossible et danger imminent</b> : se jeter au sol face contre terre, binôme regroupé, lance au-dessus des casques en <b>JDP au débit maximum</b>.</p>`;

F.vl = `
<p>Cadre : doctrine DGSCGC du 1er juin 2016 sur l'intervention d'urgence sur les véhicules (IUV). Nouveaux modes de propulsion : photovoltaïque, diester, GNV, aquazole, GPL, hybride, électrique.</p>
<h3>Reconnaître le véhicule</h3>
<ul><li><b>Hybride</b> : moteur thermique + électrique, 3 modes (série, parallèle, série-parallèle).</li><li><b>Électrique</b> : batterie ou pile à combustible. Modules en série (12 modules de 12 V = 144 V). Réservoir annexe possible pour le chauffage.</li><li><b>Batterie de traction</b> : plomb, nickel, lithium, sodium. Environ 200 kg. <b>Batterie de servitude</b> : 12 ou 24 V.</li><li><b>Câbles haute tension orange</b>, sous le véhicule ou dans les passages de roue.</li><li>Prise de recharge sur une aile ou derrière le logo.</li><li>Protections : automatiques (fusibles, relais), manuelles (<b>service plug</b>).</li></ul>
<h3>Les 4 risques</h3>
<ul><li><b>Électrique</b> : « l'intensité tue, la tension brûle ». 300 à 700 V en continu. Contact direct ou indirect, arc, court-circuit.</li><li><b>Toxique</b> : électrolyte, fumées de batterie, HCN et HF mortels par inhalation. <b>ARI obligatoire</b>. Lithium : gaz inflammable au contact de l'eau.</li><li><b>Mécanique</b> : projections de métaux réactifs jusqu'à <b>5 m</b>.</li><li><b>Thermique</b>.</li></ul>
<div class="tbl"><table><thead><tr><th>Courant alternatif</th><th>Effet</th></tr></thead><tbody>
<tr><td class="num">0,5 mA</td><td>Perception</td></tr><tr><td class="num">10 mA</td><td>Contracture, seuil de non-lâcher</td></tr><tr><td class="num">30 mA</td><td>Paralysie respiratoire</td></tr><tr><td class="num">75 mA</td><td>Fibrillation</td></tr><tr><td class="num">1 A</td><td>Arrêt du cœur</td></tr>
</tbody></table></div>
<p>Continu : perception à 2 mA, fibrillation à 1,30 A. Seuils dangereux : plus de 50 V en alternatif, plus de 120 V en continu.</p>
<h3>Méthode des 6 i</h3>
<p>Note DGSCGC du 29 juin 2012. Elle <b>complète la MGO, elle ne la remplace pas</b>.</p>
<ol><li><b>Identifier</b> : logo, câbles orange, immatriculation, carte grise, propriétaire, absence de pot d'échappement.</li><li><b>Inspecter</b> sans toucher : câbles, batteries, fuites.</li><li><b>Interdire</b> : toute action sur les vecteurs d'énergie, toucher la carcasse, toucher ou couper les câbles orange, l'attaque par l'avant ou l'arrière.</li><li><b>Immobiliser</b> : caler le véhicule.</li><li><b>Isoler</b> : débrancher la recharge.</li><li><b>Intervenir</b>.</li></ol>
<h3>Feu de véhicule à énergie alternative</h3>
<p>EPI : tenue de feu, <b>ARI capelé</b>. Périmètre adapté pour le public, <b>50 m pour les SP</b>, fourgon à 50 m comme pour un feu de VL GPL. Éviter les eaux de ruissellement. Le CA suit la température de la batterie à la caméra.</p>
<div class="tbl"><table><thead><tr><th></th><th>En extérieur</th><th>En espace clos</th></tr></thead><tbody>
<tr><td><b>Établissement</b></td><td>3 tuyaux + 1 LDV <b>250 l/min</b>, derrière des écrans naturels</td><td>3 tuyaux + 1 LDV <b>500 l/min</b>, derrière des écrans</td></tr>
<tr><td><b>Attaque</b></td><td>Par le <b>¾ avant</b>, en jet bâton. À 10 m, sans réaction violente : JDA</td><td>À portée de lance, protégé par des véhicules ou structures. Feu maîtrisé : au contact en JDA</td></tr>
<tr><td><b>BAT 1</b></td><td colspan="2">Refroidit la batterie de traction ou le réservoir de gaz</td></tr>
<tr><td><b>BAT 2</b></td><td colspan="2">Éteint l'habitacle en JDA, de la banquette arrière vers le bloc moteur</td></tr>
<tr><td><b>CA</b></td><td colspan="2">Contrôle l'efficacité à la caméra thermique</td></tr>
</tbody></table></div>
<ul><li>Emballement thermique ou réaction avec l'eau : <b>extinction impossible</b>, protéger l'environnement.</li><li>Batterie endommagée : risque de <b>feu tardif</b>.</li><li>Milieu à enjeux (confiné, urbain) : récupérer les eaux, mesures explosimétriques, évacuation dans les <b>10 min</b>.</li></ul>
<h3>Désincarcération</h3>
<ul><li>EPI spécifiques : <b>gants 1000 V</b>, casque F1 visière baissée.</li><li>Balisage, protection incendie, neutralisation des pyrotechniques.</li><li><b>Service plug</b> : déconnecté seulement en cas de force majeure, sur ordre du COS.</li><li>Arrêt moteur (MAM) : appui Start & Stop si READY affiché, levier en P, clé posée dans l'engin <b>à plus de 5 m</b>.</li><li>Batterie de servitude : <b>déconnecter le pôle moins, ne pas le couper</b> (il peut servir à rouvrir un coffre ou baisser une vitre).</li><li>Intervenir : <b>Dégarnir, Dessiner, Découper, Dégager</b>, avec la fiche d'aide à la désincarcération (Rescue Code, classeur dans VSR et FPTSR).</li></ul>`;

F.chem = `
<p>En Haute-Saône : <b>2e type de feu</b> traité, environ <b>400 interventions par an</b>. C'est aussi l'intervention qui génère le plus de contentieux contre le SDIS.</p>
<h3>Risques</h3>
<ul><li>Habitants : brûlures, intoxications, stress.</li><li>Intervenants : brûlures, intoxications, <b>chutes</b>.</li><li>Biens : propagation, destructions par les intervenants (trouées, tubages, chauffage).</li></ul>
<h3>Le bâti</h3>
<ul><li>Sortie de toit : zone de danger par choc thermique.</li><li>Traversée de plancher : propagation par conduction.</li><li>Conduit bouché : accumulation de fumée dans la pièce.</li><li>Foyers ordinaires (âtre, poêle bois ou granulés, chaudière) ou industriels (four de boulanger, chauffage collectif).</li><li>Conduits : boisseaux, dévoiement, tubage inox rigide ou souple. En construction neuve, conduit masqué par du placo, avec parfois des matériaux combustibles derrière. Relever les températures à la caméra.</li></ul>
<h3>Reconnaître un feu de cheminée</h3>
<ul><li>Odeur de suie, ronflement inhabituel du conduit.</li><li>Forte élévation de température de la cheminée.</li><li>Chute de débris (morceaux de bistre).</li><li>Fumée abondante, étincelles ou flammes au débouché.</li></ul>
<h3>Les 4 modes d'extinction</h3>
<ol><li><b>Étouffement</b> : couper le tirage, supprimer l'arrivée d'air (consigne déjà donnée par l'opérateur CODIS).</li><li><b>Dispersion du foyer</b> : retirer les combustibles du foyer, seau-pompe, gants anti-chaleur, seau métallique, pelle. Stocker à l'écart de l'habitation.</li><li><b>Refroidissement et étouffement</b> : petite quantité d'eau dans le conduit par la trappe de ramonage ou le débouché, au plus près de la partie en feu désignée par le CA. Refermer la trappe (linge mouillé). Recommencer à intervalle régulier, contrôler au <b>miroir</b>, rendre compte.</li><li><b>Dispersion dans le conduit</b> : cannes de ramonage et hérisson, ou coups secs au manche de hachette sur un conduit à paroi mince. Prévoir un moyen hydraulique. Les cannes ne stagnent pas dans le conduit.</li></ol>
<div class="alert"><b>Hérisson interdit dans un conduit inox.</b> Coups secs et maîtrisés pour ne pas fissurer ni déformer le conduit.</div>
<h3>Trouées dans un conduit en boisseau</h3>
<ul><li><b>D'extinction</b> : trou d'environ 5 cm juste <b>au-dessus</b> des matériaux en ignition, pour pulvériser de l'eau.</li><li><b>De dégagement</b> : au niveau des coudes et dévoiements, juste <b>au-dessous</b>, pour retirer les matériaux.</li></ul>
<h3>Reconnaissances</h3>
<ul><li>Se munir de l'<b>Altair 4X</b> (CO) à chaque changement de pièce.</li><li>Situer le conduit à chaque étage, repérer les trappes, vérifier l'accessibilité et la température (caméra).</li><li>Écarter les combustibles proches du conduit.</li><li>Vérifier le conduit sur toute sa hauteur au miroir ou à la lampe.</li><li>Rendre compte au CA à chaque changement de situation.</li></ul>

<p>Plus : poulie (renvoi ou mouflage), frein de charge (descendeur en 8), triangle d'évacuation à bretelles. En option : commande de 30 m Ø 7 mm, protections de corde, cordelettes.</p>
<h3>Nœuds et techniques à maîtriser</h3>
<ul><li>Le dispositif de descente</li><li>Le nœud de huit double</li><li>La clé d'arrêt sur descendeur</li><li>Le nœud français</li></ul>
<p>Ils doivent sortir vite, sous stress. Entraîne-les les yeux fermés.</p>
<h3>Vocabulaire du système</h3>
<ul><li><b>Système</b> : ancrage + amarrage + dispositif + charge + équipier.</li><li><b>Amarrage</b> : relie l'ancrage au dispositif (sangle, mousqueton).</li><li><b>Dispositif</b> : matériel assemblé qui sert à déplacer la charge (huit descendeur, poulie).</li><li><b>Charge</b> : personne, animal, objet.</li><li><b>Équipier</b> : SP formé et qualifié qui connaît le matériel.</li></ul>
<h3>Rôle de chaque élément</h3>
<ul><li><b>Sac</b> : jaune lot engin, bleu lot échelle. En mode dégradé, il sert de protection de corde.</li><li><b>Frein de charge</b> (huit descendeur) : règle la descente et retient une personne qui évolue avec risque de chute.</li><li><b>Poulie</b> : en renvoi fixe ou en mouflage. En mouflage, elle <b>divise par deux</b> l'effort à fournir. La charge ne doit pas la faire vriller.</li><li><b>Harnais</b> : fermé par un connecteur adapté. Attache sternale = mousqueton à <b>fermeture automatique</b>. Attaches toujours symétriques.</li><li><b>Triangle d'évacuation</b> : 1 dans le lot engin, conseillé dans le lot échelle.</li><li><b>Commande</b> 30 m Ø 7 mm, un mousqueton à chaque bout : écarte la victime de la façade et sert à <b>estimer la hauteur</b>.</li><li><b>Cordelettes</b> : Ø inférieur à la corde, 50 à 60 cm.</li></ul>
<h3>Règles d'or du matériel</h3>
<ul><li>Mousqueton à vis <b>fermé et verrouillé à la main</b>, sans forcer. Vis vers le bas si possible.</li><li>Mousqueton jamais chargé en travers (petit axe) ni en appui sur une arête : résistance quasi nulle.</li><li>Toujours un mousqueton pour relier deux anneaux de sangle.</li><li><b>Cordelette interdite pour un amarrage.</b></li><li>Nœud autobloquant : <b>3 tours minimum</b> autour de la corde, brins parallèles.</li><li>Tout nœud affaiblit la corde ou la sangle. La tête d'alouette affaiblit beaucoup la sangle.</li><li>Respecter le sens de travail de chaque nœud.</li><li><b>Protection de corde obligatoire</b>, surtout sur le brin dormant (arêtes, surfaces abrasives). Les sangles s'usent aussi vite que la corde.</li><li>Protection de fortune : tuyau de 110 sec, non plastifié. La corde frotte sur la face <b>enduite</b>, jamais sur la face lisse (elle chauffe et fond).</li></ul>
<h3>Les nœuds en détail</h3>
<div class="tbl"><table><thead><tr><th>Nœud</th><th>À quoi il sert</th></tr></thead><tbody>
<tr><td><b>Huit double</b></td><td>Nœud de sécurité et d'amarre. Déjà fait aux deux bouts de la corde.</td></tr>
<tr><td><b>Nœud français</b></td><td>Fait avec une cordelette : poignée de traction autobloquante (3 tours mini).</td></tr>
<tr><td><b>Clé d'arrêt</b> sur huit</td><td>Bloque la corde dans le descendeur pour sécuriser le dispositif, assurer sauveteur ou victime, libérer les mains.</td></tr>
<tr><td><b>Dispositif de descente</b></td><td>Huit descendeur relié à l'amarrage, toujours en <b>point fixe</b>.</td></tr>
</tbody></table></div>
<h3>Ancrages : choix et montage</h3>
<ul><li>Fiabilité = jugement, expérience, connaissance du terrain. <b>Dans le doute, multiplier les ancrages.</b></li><li>Ancrage minimum : <b>1 anneau cousu + 1 mousqueton</b>.</li><li>Plusieurs ancrages : répartir la charge sur tous. Variante : un seul point travaille, le second est prêt à prendre le relais.</li><li>Angle entre deux anneaux : <b>90° maximum</b>.</li><li>Véhicule comme ancrage : <b>moteur coupé, clé retirée, vitesse engagée, frein à main serré, roues calées.</b></li><li>Aucun ancrage possible : un <b>sauveteur sert de point fixe</b>.</li></ul>
<h3>Facteur de chute</h3>
<ul><li><b>Fc = hauteur de chute ÷ longueur de corde qui amortit la chute.</b></li><li><b>Fc supérieur à 1 : interdit.</b> Fc égal à 1 : à éviter.</li><li>Ancrages au-dessus ou au niveau de l'axe de déplacement.</li><li>Effet pendule si on s'écarte de l'aplomb de l'ancrage : risque de choc violent.</li><li>Corde la plus tendue possible pendant la progression.</li></ul>
<h3>Contrôles avant engagement</h3>
<ul><li><b>Tactile</b> : corps étranger dans les sangles, âme écrasée, gaine usée.</li><li><b>Visuel</b> : fissure ou casse des pièces métal, usure ou taches des textiles et coutures.</li><li>Contenu du sac contrôlé chaque jour (ou selon le SDIS si lots plombés).</li><li>Une fois le dispositif chargé, avant de descendre : regarder ancrages et sangles en charge, chercher les frottements, <b>tester le frein sur quelques centimètres</b>.</li><li><b>Vérifier que tous les mousquetons sont fermés.</b></li></ul>

<ul><li>Corde : <b>Ø 12 à 13 mm</b>, rupture <b>supérieure à 3000 kg</b>, allongement <b>4 % maxi</b>, huit double à chaque bout, alterner les bouts pour répartir l'usure.</li><li>Huit descendeur : 2000 kg. Poulie : 2000 kg, gorge 12 à 13 mm.</li><li>Mousquetons : <b>2000 kg grand axe, 750 kg petit axe</b>.</li><li>Anneaux cousus : 2000 kg, largeur 18 à 25 mm.</li><li>Le connecteur demi-lune ou triangulaire du harnais <b>ne se remplace jamais</b> par un autre modèle.</li></ul>
<h3>Limites d'emploi</h3>
<ul><li>Sauvetage par l'extérieur : hauteur maxi = <b>longueur utile de la corde</b>.</li><li>Puits, excavation : profondeur maxi = longueur de corde. ARI si atmosphère douteuse.</li><li>Protection contre les chutes : longueur de corde après le dernier renvoi <b>inférieure à la hauteur libre</b>. Points d'assurance au-dessus ou au niveau de l'axe de déplacement.</li><li>Reconnaissance d'appartement : hauteur entre les deux points inférieure à la longueur utile de corde.</li><li>Difficulté technique ou blessure grave : <b>CODIS</b>, équipe spécialisée.</li></ul>
<h3>Règles avant, pendant, après</h3>
<ul><li><b>Avant</b> : contrôle du sac, désignation du personnel, évaluation de la difficulté, de la hauteur et de l'état de la victime, choix de la méthode ou des renforts.</li><li><b>Pendant</b> : amarrages principaux <b>doublés</b> (même point fixe solide ou deux points distincts). Lot réservé à la <b>descente, la remontée et la sécurité du personnel</b>. Ne pas marcher sur la corde. Coutures et nœuds hors frottement. Mousquetons vissés. <b>Tester le frein</b> par traction sur la corde. Descendeur en point fixe. Mousqueton pour prolonger les anneaux.</li><li><b>Après</b> : regrouper par lot, nettoyage sommaire, contrôle tactile et visuel, rangement. Défaut de réforme : <b>lot retiré du service</b> jusqu'au contrôle par un responsable. Signaler tout incident ou sollicitation exceptionnelle.</li></ul>
<h3>Quand l'employer</h3>
<p>Victime exposée à un danger grave et imminent, incapable de s'y soustraire seule. En INC, PPBE ou SUAP :</p>
<ul><li>sauvetage ou mise en sécurité par l'extérieur</li><li>sauvetage en puits, fosse, excavation</li><li>protection contre les chutes et évolution avec risque de chute</li><li>reconnaissance d'appartement</li><li>abordage ou sécurisation d'une victime en péril</li><li>déplacement d'une victime inconsciente ou invalide par un sauveteur</li></ul>
<h3>Règles de mise en œuvre</h3>
<ul><li>Prévoir un parc à matériel. Rien sur un sol jonché de débris.</li><li>Mousquetons <b>toujours vissés</b>, sens de vissage <b>vers le bas</b>.</li><li>Le <b>huit descendeur toujours en point fixe</b>.</li><li>Un mousqueton pour relier deux anneaux cousus entre eux.</li><li>Ne pas marcher sur les textiles.</li></ul>
<h3>Ancrages</h3>
<ul><li><b>Naturel</b> : arbre, rocher.</li><li><b>Structurel</b> : poutre, pilier, rambarde, colonne sèche, échelle aérienne, fourgon, mobilier urbain.</li><li><b>Artificiel</b> : posé par l'homme, échelle à main, outil de forcement, étai.</li></ul>
<h3>Sauvetage par l'extérieur</h3>
<ul><li>Évacuation verticale au sol ou entre niveaux, le long d'une façade, victime consciente ou non. Parfois quelques mètres suffisent.</li><li>Hauteur maximale = <b>longueur utile de la corde</b> : distance entre le point de réception et le dispositif de freinage.</li><li>Victime inconsciente : descente au harnais ou triangle, y compris sur le parc d'une échelle aérienne sans panier ou sur une échelle à coulisse.</li></ul>
<h3>Puits, fosse, excavation</h3>
<ul><li>Remontée verticale. Doute sur l'air : <b>ARI</b>.</li><li>Matériel de sauvetage classique en plus (échelles à coulisse).</li><li>La distance frein → point de récupération → amarrage doit être <b>inférieure à la longueur de corde</b>.</li></ul>
<h3>Protection contre les chutes</h3>
<ol><li>Corde la plus tendue possible.</li><li>L'assureur reste attentif et reprend le mou.</li><li><b>Facteur de chute jamais supérieur à 1</b> : points d'amarrage au-dessus ou au niveau de l'axe de déplacement.</li></ol>
<ul><li>Sur un toit : amarrages sur la charpente (poutre, panne) après avoir retiré les tuiles.</li><li>Distance entre amarrages fixée par la <b>hauteur libre</b> (dernier amarrage → premier obstacle), en tenant compte de l'élasticité. La corde après le dernier renvoi reste plus courte que cette hauteur.</li><li>Un personnel reste au frein de charge.</li></ul>
<h3>Reconnaissance d'appartement</h3>
<ul><li>Personne ne répondant pas aux appels, ouverture de porte avec victime, façade inaccessible aux échelles : descente depuis l'étage supérieur.</li><li>Déterminer d'abord l'<b>itinéraire de sortie</b> du sauveteur.</li><li>Rester amarré pendant la reconnaissance succincte de la 1re pièce. Sans risque, après avoir prévenu l'assureur, se désolidariser et fixer le mousqueton de la corde sur un point d'attache.</li></ul>
<h3>Décision et limites</h3>
<ul><li>Le sauvetage est prioritaire : seul le sauvetage ou la protection de personnes justifie un risque calculé pour les SP.</li><li>Le LSPCC est une alternative quand les moyens plus sûrs (communications existantes, MEA, échelles à main) sont indisponibles, ou quand il faut agir tout de suite.</li><li>Le <b>COS valide</b> l'emploi du LSPCC après analyse des risques, ou demande une équipe spécialisée (SMPM).</li><li>Limites : matériel insuffisant, situation pour équipe spécialisée, victime qui nécessite des soins spécifiques.</li></ul>
<h3>Manœuvre : sauvetage par l'extérieur</h3>
<p><b>2 binômes.</b> Le CA désigne le personnel, indique le lieu du sauvetage et fixe les moyens d'accès.</p>
<ol><li><b>Binôme 1 (CE + équipier), en haut</b> : le CE choisit 1 ou 2 points fixes, fait l'amarrage, <b>estime la hauteur</b> (commande), installe le dispositif de descente, équipe la victime (harnais ou triangle), la connecte, <b>contrôle tous les mousquetons</b>. L'équipier apporte le matériel et l'aide.</li><li>Huit descendeur : au moins <b>20 cm</b> au-dessus du point d'appui au passage au vide.</li><li>Mise au vide : frein sécurisé, prévoir du mou pour le passage de l'arête. Victime inconsciente : portée par 2 sauveteurs, <b>pieds en avant, face vers le sol</b>.</li><li>Le CE contrôle le frein et aide la victime à démarrer la descente.</li><li><b>Binôme 2, en bas</b> : l'équipier écarte la victime de la façade avec la commande et la réceptionne.</li></ol>
<div class="note">Souvent, descendre la victime de <b>quelques mètres</b> suffit : c'est le plus simple et le plus sûr.</div>
<h3>Manœuvre rapide : l'équipier point fixe</h3>
<ul><li>Urgence, aucun ancrage possible.</li><li>L'équipier met le harnais équipé du descendeur, s'assoit au sol, <b>jambes à 90° contre le mur</b>, et contrôle la descente.</li><li>Le CA participe à la mise au vide de la victime.</li></ul>
<h3>Manœuvre : harnais sur MEA sans panier</h3>
<ol><li>Victime inconsciente en PLS, harnais posé à plat à côté.</li><li>Faire rouler la victime sur le harnais.</li><li>Fermer les sangles <b>du bas d'abord</b>, puis celles du haut. Connecter avec un mousqueton.</li><li>Pour soulever : crocheter une jambe, le bras du même côté en contrepoids.</li></ol>
<h3>Manœuvre : puits, fosse, excavation</h3>
<ul><li><b>2 binômes</b> : un binôme sauvetage, un binôme récupération, chacun avec CE + équipier.</li><li>Atmosphère douteuse : <b>contrôle à l'explosimètre</b>, puis <b>ARI</b>.</li><li>1 ou 2 points fixes pour l'amarrage de la corde et du frein.</li><li>Le sauveteur s'attache à la corde avec harnais, poulie et mousqueton.</li><li>Le binôme récupération monte le système de remontée avec une poulie sur le triangle de la victime (mouflage).</li><li>Sauveteur et victime sont remontés et réceptionnés, puis on aide le CE à remonter.</li><li>Distance frein, point de récupération, amarrage : <b>inférieure à la longueur de corde</b>.</li></ul>
<h3>Manœuvre : progression en toiture</h3>
<ul><li><b>1 binôme</b>. Le CE choisit les points fixes, amarre le huit descendeur.</li><li>Amarrages intermédiaires selon le besoin (charpente, panne, poutre, tuiles retirées). L'équipier assure le CE.</li><li>Distance entre amarrages fixée par la <b>hauteur libre</b> (dernier amarrage, premier obstacle), élasticité comprise.</li><li>Fin d'intervention : récupérer sangles et mousquetons.</li></ul>
<h3>Manœuvre : reconnaissance d'appartement</h3>
<ul><li>Pas de réponse aux appels, façade inaccessible aux échelles : descente depuis l'étage supérieur. <b>ARI systématique</b> si la victime ne répond pas.</li><li>Définir d'abord l'<b>itinéraire de sortie</b> du sauveteur.</li><li>Rester amarré pendant la reconnaissance de la 1re pièce. Sans risque : prévenir l'assureur, se désolidariser, fixer la corde sur un point d'attache.</li></ul>
<h3>Sauvetage par l'extérieur : rôles détaillés</h3>
<div class="tbl"><table><thead><tr><th>Qui</th><th>Rôle</th></tr></thead><tbody>
<tr><td><b>CA, avant</b></td><td>Désigne le personnel, indique le lieu, fixe les moyens d'accès.</td></tr>
<tr><td><b>Binôme 1, avant</b></td><td>Prend le lot, se rend sur place.</td></tr>
<tr><td><b>Binôme 2, avant</b></td><td>Se munit d'une commande, suit le chef.</td></tr>
<tr><td><b>Chef B1</b></td><td>Va chercher la victime, l'approche du point d'évacuation. Choisit 1 ou 2 points fixes, amarre. Installe le dispositif après avoir estimé la hauteur. Relie harnais ou triangle à la corde par mousqueton. Vérifie tous les mousquetons. Démarre la descente en <b>gardant le brin libre</b>, contrôle et régule.</td></tr>
<tr><td><b>Équipier B1</b></td><td>Équipe la victime (triangle ou harnais), aide à l'amener au bord. Fixe la commande sur l'<b>anneau dorsal</b>, envoie l'autre bout au binôme 2.</td></tr>
<tr><td><b>Binôme 2</b></td><td>Écarte la victime de la façade avec la commande, la réceptionne.</td></tr>
<tr><td><b>Après</b></td><td>Contrôle et rangement sur place. Contrôle et entretien du lot au retour par le responsable.</td></tr>
</tbody></table></div>
<h3>Manœuvre spécifique : déroulé complet</h3>
<ol><li>Urgence, aucun amarrage possible : <b>l'équipier sert de point fixe</b>.</li><li>Il met le harnais équipé du huit, s'assoit au sol, <b>les deux pieds contre le mur</b>.</li><li>Huit à <b>plus de 20 cm</b> du point d'appui au passage au vide.</li><li>Victime équipée du <b>triangle</b>, commande sur l'anneau dorsal, autre bout au binôme 2.</li><li>Le <b>chef participe à la mise au vide</b>.</li><li>Descente régulée <b>sur ordre du chef</b>.</li></ol>
<h3>Excavation : déroulé complet</h3>
<ul><li>En général <b>2 dispositifs face à face</b> : un pour le sauveteur, un pour la victime.</li><li><b>Chef exploration</b> : s'équipe du harnais, choisit 2 points fixes (1er pour la corde, 2e pour le huit), installe une <b>poulie sur la corde reliée à son harnais</b>, vérifie les mousquetons, ARI si besoin, descend avec le matériel préparé par le binôme de remontée. Équipe la victime du triangle et coordonne la remontée.</li><li><b>Équipier exploration</b> : aide à l'installation, amarre la corde et le huit, contrôle la descente du chef.</li><li><b>Binôme de remontée</b> : amarre la corde de remontée et le huit, installe une poulie reliée au triangle de la victime, envoie le tout au chef. Hisse la victime, la réceptionne, aide à remonter le chef.</li><li>Traction facilitée par un <b>nœud français</b> sur cordelette (poignée).</li><li>Urgence : le COS peut décider d'un seul LSPCC, <b>s'il est certain que le sauveteur sera en sécurité</b> pendant la remontée de la victime.</li></ul>
<h3>Protection contre les chutes : rôles</h3>
<ul><li><b>Avant</b> : le chef indique le cheminement et désigne le personnel. L'équipier prend le lot, s'équipe du harnais, suit le chef.</li><li><b>Chef</b> : choisit 1 ou 2 points fixes, amarre le huit, vérifie les mousquetons, <b>assure l'équipier</b>.</li><li><b>Équipier</b> : prend amarrages et mousquetons, progresse, pose des amarrages intermédiaires si besoin, puis <b>assure le chef</b>.</li><li><b>Après</b> : récupère les amarrages au retour, contrôle et range sur place.</li></ul>
<h3>Relevage et transport avec le harnais du sauveteur</h3>
<ol><li>Victime inconsciente en PLS.</li><li>Harnais étalé au sol derrière elle, sangles desserrées.</li><li>Rouler la victime sur le harnais.</li><li>Passer les jambes dans les sangles basses, serrer.</li><li>Passer les bras dans les sangles hautes, sans serrer.</li><li>Se placer dos à dos avec la victime.</li><li>Passer ses bras dans les sangles hautes.</li><li>Relier les sangles hautes avec le connecteur demi-lune.</li><li>Serrer les sangles hautes.</li><li>Se mettre à quatre pattes, puis se relever.</li><li>Placer la victime sur son dos.</li><li>Régler la tension des sangles.</li></ol>
<p>Victime consciente : étapes 4 à 9, puis 11 et 12.</p>
<h3>Durée de vie de la corde</h3>
<ul><li>Guide 1999 : <b>7 ans maximum</b>, année repérée par un <b>fil de couleur dans la gaine</b>. Aujourd'hui, suivre la notice du fabricant.</li><li>Le matériel doit être <b>contrôlé par un responsable avant remise en service</b>.</li></ul>
<h3>Syndrome du harnais</h3>
<ul><li>Suspension inerte prolongée : baisse du retour veineux, perte de connaissance, <b>décès possible en quelques minutes</b>.</li><li>Signes : vertiges, fatigue, nausées, tremblements, troubles visuels, angoisse.</li><li>Aggravants : stress, compression des membres, froid, alcool, drogues.</li><li>Conduite : dégager et sécuriser vite, soins, <b>surveillance étroite</b> (dégradation brutale possible), avis médical précoce.</li></ul>
<h3>Entretien et réforme</h3>
<ul><li>Corde sale : rincer à l'eau douce, <b>30 °C maximum</b>, sans détergent. Séchage à plat, à l'ombre.</li><li>Contrôle tactile et visuel après chaque utilisation. Retourner la corde au rangement.</li><li><b>Réforme immédiate</b> : atmosphère ou produit corrosif, brûlure ou fusion, gaine coupée ou usée jusqu'à l'âme, diamètre réduit, zone raide, hernie d'âme.</li><li>Après une chute, même petite : corde, harnais, sangles à contrôler, réforme possible.</li><li>Matériel douteux : écarté tout de suite et signalé à la personne compétente.</li></ul>
<div class="note">Difficulté technique ou blessure grave : équipe spécialisée <b>SMPM</b> (secours en milieu périlleux et montagne) ou <b>USAR</b>.</div>`;

<h3>Missions</h3>
<ul><li>Sauvetage.</li><li>Reconnaissance.</li><li>Mise en place d'un établissement.</li><li>Itinéraire de secours pour le personnel.</li></ul>
<p>Avant de dresser : <b>observer et analyser</b> la mission (sauvetage, reconnaissance, établissement, itinéraire de secours). Elle décide de la position.</p>
<h3>Positionnement selon la mission</h3>
<div class="tbl"><table><thead><tr><th>Position de la tête</th><th>Quand</th></tr></thead><tbody>
<tr><td><b>Au ras</b> de l'ouvrant</td><td>Accès direct</td></tr>
<tr><td><b>À côté</b> de l'ouvrant</td><td>Ne pas gêner la sortie d'un binôme, ouvrant large, établissement</td></tr>
<tr><td><b>Dépassant</b> le rebord</td><td>Sauvetage : sert d'appui pour aider la victime</td></tr>
<tr><td><b>Juste sous</b> le rebord</td><td>Itinéraire de secours du personnel</td></tr>
<tr><td>Dépasse le bord du toit de <b>3 à 5 échelons</b></td><td>Accès toiture : appui pour monter et descendre</td></tr>
</tbody></table></div>
<h3>Piétage et stabilité</h3>
<ul><li><b>Piétage = 1/3 de la longueur développée</b> (distance mur, pied de l'échelle).</li><li>Vérification : <b>un pas par étage</b> et le <b>test du coude</b>.</li><li>Ni trop développée, ni trop inclinée.</li><li>Pieds sur un plan horizontal et stable si possible.</li><li>Itinéraire de secours : <b>pied augmenté</b> pour réduire la pente : <b>4 grands pas</b> de la façade pour le 1er étage, <b>5</b> pour le 2e (fiche TASSS). Aucun montant ne dépasse l'appui, grand plan contre la façade, échelle amarrée ou calée.</li><li>Règle générale : l'échelle est toujours <b>maintenue, calée ou amarrée</b>. Coulisse amarrée dès que possible.</li></ul>
<h3>Règles de sécurité</h3>
<ul><li>Charge : <b>1 personne par plan</b>, sauf sauvetage.</li><li>Échelle à crochets : <b>1 SP</b>, accompagné d'une seule autre personne en sauvetage.</li><li><b>Jamais deux pieds sur le même échelon.</b></li><li>Bien positionner et vérifier les <b>parachutes</b> (verrous des plans).</li><li>Tenir les montants au déploiement et au repliement.</li><li>Échelle à crochets posée à plat : <b>crochets tournés vers le sol</b>.</li><li>Échelle à crochets <b>testée avant engagement</b> (traction).</li></ul>
<h3>Manœuvres de base de la coulisse</h3>
<ul><li><b>EC2P-1</b> : manœuvres faisables par un seul SP si nécessaire.</li><li><b>EC2P-2, déplacement rapide</b> : échelle portée déployée, sans la replier. Main basse porte, main haute guide.</li><li><b>EC2P-3, rotation</b> : bouts des montants en contact avec la façade, l'échelle tourne sur elle-même vers l'ouvrant visé.</li><li><b>EC2P-4, attache du trait</b> : facilite la manipulation, évite les entraves et les blocages, bloque les plans si les parachutes sont mal verrouillés. Nœud à libération rapide. <b>Sauvetages multiples : on n'attache pas le trait</b>, on le place judicieusement.</li><li><b>EC2P-5, itinéraire de secours</b> : échelle retournée, <b>grand plan vers le bas</b> (les montants n'accrochent pas à la descente). Vérifier l'engagement des parachutes après retournement.</li></ul>
<h3>Sauvetage d'une victime valide</h3>
<ul><li>Anticiper ses réactions, l'accompagner pendant la descente.</li><li>Attention au <b>passage au vide</b>.</li><li>Contact physique et verbal, aider à placer les pieds sur les échelons.</li><li>Anticiper un mouvement latéral.</li><li>Une personne valide peut descendre seule : le sauveteur s'adapte.</li></ul>
<h3>Victime invalide : méthode à 3 SP (méthode de base)</h3>
<p>2 SP dans le volume (avec ARI), 1 SP sur l'échelle.</p>
<ol><li>Jambes de la victime perpendiculaires au sol, contre le mur sous l'ouvrant.</li><li>Saisie sous les épaules et à la ceinture.</li><li>Le SP sur l'échelle saisit les chevilles.</li><li>Jambes levées au-dessus du rebord.</li><li>Genoux de la victime sur les épaules du SP sur l'échelle.</li><li>Victime dos contre les échelons, on descend. Un 4e SP peut aider à la réception.</li></ol>
<h3>Victime invalide : méthode à 2 SP (mode dégradé)</h3>
<ol><li>Approcher la victime de l'ouvrant.</li><li>Jambes à l'équerre, dos au sol, saisie sous les aisselles.</li><li>Passer l'ouvrant, déposer la victime sur l'échelle.</li><li>Saisir les chevilles, genoux sur les épaules.</li><li>Descendre en la faisant glisser dos contre les échelons.</li></ol>
<h3>Échelle à crochets</h3>
<ul><li>Quand : escaliers impraticables, coulisse impossible à dresser (cour, impasse, passage étroit), limite d'une autre échelle atteinte.</li><li>Suspendue par ses crochets ou appuyée sur ses pics.</li><li>Progression par l'extérieur, d'étage en étage, de balcon en balcon ou d'appui en appui.</li><li>Sur un faîtage de toiture : facilite le déplacement, et reste en place comme <b>itinéraire de repli</b>.</li></ul>
<h3>Montée par prolongement de la coulisse</h3>
<ol><li>L'équipier dresse l'échelle à crochets et la passe au CE.</li><li>Le CE monte sur la coulisse.</li><li>Il croche une jambe et saisit l'échelle à crochets pour l'élever.</li><li>Une fois crochée, il <b>tire dessus pour tester</b>, puis s'y engage.</li></ol>
<h3>Descente d'une victime à l'échelle à crochets</h3>
<ul><li>Un SP monte au niveau de la victime, la rassure, l'aide à franchir le vide et à poser les pieds.</li><li>Elle descend <b>collée à l'échelle</b>. Un second SP tient fermement l'échelle.</li><li>Demander s'il reste d'autres personnes à évacuer.</li><li>Descente impossible : envisager le <b>LSPCC</b>.</li></ul>`;

<ul><li>Décidée par le <b>COS</b>. Ordre connu de tous, transmissible par tout intervenant.</li><li>5 cas : feu dangereux qui évolue vite, <b>effondrement imminent</b>, explosion possible, alerte de la <b>sonnette</b>, toute évolution défavorable rapide.</li><li>Radio prioritaire : <b>« URGENT, URGENT, URGENT, ÉVACUATION GÉNÉRALE » x3</b>, relayé par CA et contrôleurs à leurs binômes.</li><li>Signaux complémentaires : mégaphone de l'engin en mode sirène, corne, klaxon, sifflets.</li></ul>
<ol><li>Diffuser le message.</li><li>Regrouper le personnel au(x) <b>point(s) de regroupement</b> fixé(s) à l'avance par le COS, en zone sûre.</li><li><b>Appel</b> par les chefs d'agrès et chefs de secteur.</li><li>Compte rendu aux chefs de secteur et au COS.</li><li>Adapter les opérations.</li></ol>

<ul><li>Placé par le COS dès qu'une équipe entre en zone d'exclusion, au <b>point d'entrée</b> en zone contrôlée, sous l'autorité du seul <b>contrôleur</b>.</li><li>Formé au sauvetage de sauveteur. Il signale sa présence aux équipes engagées.</li><li>Attente : surveille l'entrée, aide progression et repli, garde le contact, écoute radio permanente. <b>10 porteurs ARI maxi</b> (4 binômes + lui).</li><li>Action : engagé sur ordre du CA ou du contrôleur dès qu'une équipe est en difficulté.</li><li>Dès qu'il est engagé : <b>désigner un remplaçant</b>.</li></ul>

<ul><li><b>Assistance en air</b> : couper l'alarme de la balise, vérifier l'air dans le masque, lire le manomètre, brancher le masque de l'équipier sur sa <b>sortie de secours</b>, cagoule de sauvetage si besoin.</li><li><b>Mise sur l'échelle pieds en avant</b> : <b>dernier recours</b>, ARI retiré avant, pied à 4 grands pas maxi (1er) ou 5 (2e), échelle amarrée ou calée.</li><li><b>Déshabillage</b> du sauveteur inconscient : <b>2 personnes mini</b>. Tête : casque, bretelles, masque (débrancher le SAD), cagoule, manches, « prêt ». Jambes : sangle ventrale, gants, veste, bottes, pantalon, tire au « prêt ».</li></ul>
<h3>Auto-sauvetage</h3>
<ul><li>Évaluer : le problème, la stabilité, l'air restant, le besoin d'aide. Puis tenter l'évacuation <b>ou</b> économiser l'air et attendre les secours.</li><li><b>Ligne guide</b> : 50 à 60 m, Ø 6 à 8 mm. <b>1 olive</b> en 2e position = direction de la <b>sortie</b>, <b>3 olives</b> = direction du <b>feu</b>. Un tuyau établi peut servir de ligne guide.</li><li><b>Passage étroit</b> : épaules environ 36 cm. Plongeon, profil réduit (bouteille décalée derrière l'épaule), retrait de l'ARI en <b>dernier recours</b> en gardant le robinet accessible.</li><li><b>Enchevêtrement</b> : s'arrêter, reculer pour détendre les fils, passer dessous sur le côté gauche, bras droit en chasse-neige.</li><li><b>Position d'attente à la fenêtre</b> : exposer un bras et une jambe à la chaleur, jamais la tête ni le tronc.</li><li>Balise (BSD) : détecteur d'immobilité, alarme sonore et lumineuse, déclenchement manuel pour demander de l'aide.</li></ul>`;

<h3>Pourquoi économiser l'air</h3>
<ul><li>Principe du <b>sablier</b> : le temps que met la bouteille à se vider est le temps qu'il te reste si tu ne rejoins pas la sortie.</li><li>En attendant le binôme de sécurité, contrôler sa respiration devient la <b>priorité absolue</b>.</li><li>L'efficacité varie sur le terrain à cause du <b>stress</b>.</li></ul>
<h3>Consommation d'air</h3>
<div class="tbl"><table><thead><tr><th>Situation</th><th>Consommation</th></tr></thead><tbody>
<tr><td>Effort intense</td><td class="num">jusqu'à <b>90 à 100 l/min</b></td></tr>
<tr><td>Porteur ARI moyen</td><td class="num"><b>40 à 70 l/min</b></td></tr>
<tr><td>Mode économie</td><td class="num">jusqu'à <b>10 à 12 l/min</b></td></tr>
</tbody></table></div>
<p>Avant de choisir une technique : évaluer si l'on est en mode <b>effort intense</b> ou <b>économie d'énergie</b>.</p>
<h3>Les 4 techniques de respiration</h3>
<div class="tbl"><table><thead><tr><th>Technique</th><th>Déroulé</th><th>Rythme</th></tr></thead><tbody>
<tr><td><b>Sauter une respiration</b></td><td>Inspirer profondément, retenir jusqu'à sa limite, expirer lentement, recommencer. Seul ou en binôme.</td><td class="num">3 à 4 respirations/min. La plus simple, pas la plus efficace.</td></tr>
<tr><td><b>Intervalle respiratoire</b></td><td>Inspirer 5 s, bloquer 5 s, expirer 5 s, bloquer 5 s, recommencer.</td><td class="num">Cycle de 20 s, environ 3 respirations/min.</td></tr>
<tr><td><b>Méthode Reilly</b></td><td>Inspirer normalement, expirer lentement <b>en fredonnant</b>, recommencer.</td><td class="num">Environ 2 respirations/min. Parmi les plus efficaces, <b>ralentit nettement le cœur</b>.</td></tr>
<tr><td><b>Méthode 2/4</b></td><td>Inspirer en 2 s, expirer en 4 s, recommencer.</td><td class="num">Expiration deux fois plus longue que l'inspiration.</td></tr>

<h3>Quand les utiliser</h3>
<ul><li><b>Dès le masque capelé</b>, pour augmenter l'autonomie et mener la mission.</li><li>En cas de <b>malaise</b>, pour récupérer ses capacités.</li><li>Indispensable pour sortir d'une <b>situation critique imprévue</b> et/ou attendre une équipe de sauvetage.</li></ul>
<h3>Gestion d'une fuite (matériel endommagé)</h3>
<p>Ce n'est <b>pas</b> une technique d'économie : uniquement si masque, tuyau ou soupape à la demande sont endommagés.</p>
<ol><li>Ouvrir le robinet de la bouteille d'<b>un quart de tour</b> et inspirer.</li><li>Fermer le robinet et retenir sa respiration jusqu'à sa limite.</li><li>Expirer lentement, recommencer.</li></ol>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5;
const dn=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);
const today=()=>dn(new Date());
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const toIso=n=>new Date(n*DAY).toISOString().slice(0,10);
const dateOf=n=>new Date(n*DAY);
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const JOURS_L=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const wd=n=>dateOf(n).getUTCDay();
const fmt=n=>`${JOURS[wd(n)]} ${dateOf(n).getUTCDate()} ${MOIS[dateOf(n).getUTCMonth()]}`;
