const SCHEMAS=[{"id": "chaine", "m": "cmd", "title": "La chaîne de commandement", "svg": "<svg viewBox=\"0 0 400 452\" role=\"img\" aria-label=\"Chaîne de commandement de haut en bas : chef de site, chef de colonne, chef de groupe, chef d'agrès, chef d'équipe, équipier. Les ordres descendent d'un échelon, les comptes rendus remontent d'un échelon.\"> <defs><marker id=\"c1d\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker> <marker id=\"c1u\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"mkr\"/></marker></defs> <g> <rect class=\"bx\" x=\"70\" y=\"12\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tb\" x=\"200\" y=\"36\" text-anchor=\"middle\">Chef de site · OAD</text><text class=\"tm\" x=\"200\" y=\"56\" text-anchor=\"middle\">opération à plus d'une colonne</text> <rect class=\"bx\" x=\"70\" y=\"84\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tb\" x=\"200\" y=\"108\" text-anchor=\"middle\">Chef de colonne · OPD</text><text class=\"tm\" x=\"200\" y=\"128\" text-anchor=\"middle\">2 à 4 groupes</text> <rect class=\"bx\" x=\"70\" y=\"156\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tb\" x=\"200\" y=\"180\" text-anchor=\"middle\">Chef de groupe</text><text class=\"tm\" x=\"200\" y=\"200\" text-anchor=\"middle\">2 à 4 agrès, hors matériels d'appui</text> <rect class=\"bx\" x=\"70\" y=\"228\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tb\" x=\"200\" y=\"252\" text-anchor=\"middle\">Chef d'agrès</text><text class=\"tm\" x=\"200\" y=\"272\" text-anchor=\"middle\">1er maillon · 1 agrès, 1 ou plusieurs équipes</text> <rect class=\"fr\" x=\"70\" y=\"300\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tw\" x=\"200\" y=\"324\" text-anchor=\"middle\">Chef d'équipe : toi</text><text x=\"200\" y=\"344\" text-anchor=\"middle\" style=\"fill:#fff;font-size:12px\">dirige 1 équipier</text> <rect class=\"bx sunk\" x=\"70\" y=\"372\" width=\"260\" height=\"56\" rx=\"10\"/><text class=\"tb\" x=\"200\" y=\"404\" text-anchor=\"middle\">Équipier</text> </g> <line class=\"ln\" x1=\"40\" y1=\"30\" x2=\"40\" y2=\"408\" marker-end=\"url(#c1d)\"/> <text class=\"t\" transform=\"translate(28 220) rotate(-90)\" text-anchor=\"middle\">ordonne et contrôle</text> <line class=\"ln sr\" x1=\"360\" y1=\"408\" x2=\"360\" y2=\"30\" marker-end=\"url(#c1u)\"/> <text class=\"tr\" transform=\"translate(378 220) rotate(90)\" text-anchor=\"middle\">rend compte</text> </svg>", "cap": "Chaque échelon n'ordonne qu'à ses subordonnés directs, contrôle l'exécution et rend compte à son supérieur direct. Sans chef d'agrès qualifié, l'engin part en premier secours sous le commandement du plus ancien dans le grade le plus élevé."}, {"id": "explo", "m": "explo", "title": "Explosible ou explosive ?", "svg": "<svg viewBox=\"0 0 420 230\" role=\"img\" aria-label=\"Échelle de concentration de gaz de 0 à 100 %. Sous la LIE et au-dessus de la LSE l'atmosphère est explosible ; entre la LIE et la LSE elle est explosive. L'explosimètre mesure de 0 à 100 % de la LIE, le catharomètre le pourcentage de gaz dans le volume.\"> <defs><marker id=\"c2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs> <path class=\"ln thin\" d=\"M20 26 V20 H400 V26\"/><text class=\"t\" x=\"210\" y=\"14\" text-anchor=\"middle\">Catharomètre : % de gaz dans le volume</text> <path class=\"ln thin\" d=\"M20 60 V54 H130 V60\"/><text class=\"tb\" x=\"75\" y=\"48\" text-anchor=\"middle\">Explosimètre</text><text class=\"tm\" x=\"75\" y=\"78\" text-anchor=\"middle\">0 à 100 % de la LIE</text> <rect class=\"fs\" x=\"20\" y=\"90\" width=\"110\" height=\"70\" rx=\"6\"/><text class=\"tb\" x=\"75\" y=\"120\" text-anchor=\"middle\">Explosible</text><text class=\"tm\" x=\"75\" y=\"140\" text-anchor=\"middle\">trop pauvre</text> <rect class=\"fr\" x=\"130\" y=\"90\" width=\"130\" height=\"70\"/><text class=\"tw\" x=\"195\" y=\"122\" text-anchor=\"middle\">EXPLOSIVE</text><text x=\"195\" y=\"142\" text-anchor=\"middle\" style=\"fill:#fff;font-size:12px\">danger</text> <rect class=\"fs\" x=\"260\" y=\"90\" width=\"140\" height=\"70\" rx=\"6\"/><text class=\"tb\" x=\"330\" y=\"120\" text-anchor=\"middle\">Explosible</text><text class=\"tm\" x=\"330\" y=\"140\" text-anchor=\"middle\">trop riche, manque d'air</text> <line class=\"ln\" x1=\"20\" y1=\"180\" x2=\"404\" y2=\"180\" marker-end=\"url(#c2)\"/> <line class=\"ln\" x1=\"130\" y1=\"84\" x2=\"130\" y2=\"188\"/><line class=\"ln\" x1=\"260\" y1=\"84\" x2=\"260\" y2=\"188\"/> <text class=\"tb\" x=\"130\" y=\"206\" text-anchor=\"middle\">LIE</text><text class=\"tb\" x=\"260\" y=\"206\" text-anchor=\"middle\">LSE</text> <text class=\"tm\" x=\"20\" y=\"206\">gaz 0 %</text><text class=\"tm\" x=\"400\" y=\"206\" text-anchor=\"end\">gaz 100 %</text> <text class=\"tm\" x=\"210\" y=\"224\" text-anchor=\"middle\">Altair 4X calibré au méthane · laisser analyser environ 30 s</text> </svg>", "cap": "L'explosimètre ne voit que la zone de gauche, jusqu'à la LIE. Un mélange trop riche n'est pas sûr pour autant : en se diluant, il repasse par la zone explosive."}, {"id": "phases", "m": "risque", "title": "Les phases de développement du feu", "svg": "<svg viewBox=\"0 0 430 270\" role=\"img\" aria-label=\"Courbe de puissance du feu dans le temps : feu naissant, feu croissant limité par le combustible, flashover, feu pleinement développé limité par la ventilation, puis déclin. Variante en volume clos : le feu décline par manque d'oxygène, puis une rupture de confinement le relance brutalement.\"> <defs><marker id=\"c3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker> <marker id=\"c3r\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidt 'arrivée du comburant qui déclenche, en volume clos. FGI : c'est l'arrivée de l'énergie d'activation qui déclenche, dans les volumes adjacents.\"> <g transform=\"translate(75 0)\"> <path class=\"ln\" style=\"stroke-width:3\" d=\"M0 30 L58 130 L-58 130 Z\"/> <circle class=\"fy\" cx=\"0\" cy=\"30\" r=\"9\"/><circle class=\"fy\" cx=\"-58\" cy=\"130\" r=\"9\"/><circle class=\"fy\" cx=\"58\" cy=\"130\" r=\"9\"/> <text class=\"td\" x=\"0\" y=\"168\" text-anchor=\"middle\">FLASHOVER</text><text class=\"t\" x=\"0\" y=\"188\" text-anchor=\"middle\">volume ventilé</text><text class=\"tm\" x=\"0\" y=\"206\" text-anchor=\"middle\">gaz + énergie</text><text class=\"tm\" x=\"0\" y=\"222\" text-anchor=\"middle\">+ veine d'air maintenue</text> </g> <g transform=\"translate(225 0)\"> <path class=\"ln\" style=\"stroke-width:3\" d=\"M0 30 L58 130 L-58 130 Z\"/> <circle class=\"fy\" cx=\"0\" cy=\"30\" r=\"9\"/><circle class=\"fy\" cx=\"-58\" cy=\"130\" r=\"9\"/><circle class=\"fr\" cx=\"58\" cy=\"130\" r=\"13\"/> <text class=\"tr\" x=\"60\" y=\"154\" text-anchor=\"middle\">AIR</text> <text class=\"td\" x=\"0\" y=\"168\" text-anchor=\"middle\">BACKDRAFT</text><text class=\"t\" x=\"0\" y=\"188\" text-anchor=\"middle\">volume clos</text><text class=\"tm\" x=\"0\" y=\"206\" text-anchor=\"middle\">déclencheur :</text><text class=\"tr\" x=\"0\" y=\"222\" text-anchor=\"middle\">apport de comburant</text> </g> <g transform=\"translate(375 0)\"> <path class=\"ln\" style=\"stroke-width:3\" d=\"M0 30 L58 130 L-58 130 Z\"/> <circle class=\"fr\" cx=\"0\" cy=\"30\" r=\"13\"/><circle class=\"fy\" cx=\"-58\" cy=\"130\" r=\"9\"/><circle class=\"fy\" cx=\"58\" cy=\"130\" r=\"9\"/> <text class=\"tr\" x=\"0\" y=\"14\" text-anchor=\"middle\">ÉNERGIE</text> <text class=\"td\" x=\"0\" y=\"168\" text-anchor=\"middle\">FGI</text><text class=\"t\" x=\"0\" y=\"188\" text-anchor=\"middle\">volumes adjacents</text><text class=\"tm\" x=\"0\" y=\"206\" text-anchor=\"middle\">déclencheur :</text><text class=\"tr\" x= ier amarrage au premier obstacle.\"> <defs><marker id=\"c8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs> <rect class=\"fgs\" x=\"10\" y=\"10\" width=\"200\" height=\"230\" rx=\"12\"/><text class=\"tg\" x=\"110\" y=\"32\" text-anchor=\"middle\">AUTORISÉ</text> <line class=\"ln dash mut\" x1=\"24\" y1=\"120\" x2=\"196\" y2=\"120\"/><text class=\"tm\" x=\"196\" y=\"140\" text-anchor=\"end\">axe de déplacement</text> <circle class=\"fg\" cx=\"70\" cy=\"86\" r=\"8\"/><text class=\"tm\" x=\"70\" y=\"70\" text-anchor=\"middle\">amarrage</text> <circle cx=\"150\" cy=\"120\" r=\"9\" class=\"mk\"/><path class=\"ln\" style=\"stroke-width:3\" d=\"M150 129 V160 M150 140 L136 152 M150 140 L164 152 M150 160 L140 180 M150 160 L160 180\"/> <path class=\"ln sg\" style=\"stroke-width:2.5\" d=\"M70 86 Q110 96 146 118\"/> <line class=\"ln\" x1=\"40\" y1=\"94\" x2=\"40\" y2=\"224\" marker-start=\"url(#c8)\" marker-end=\"url(#c8)\"/><text class=\"t\" transform=\"translate(30 160) rotate(-90)\" text-anchor=\"middle\">hauteur libre</text> <line class=\"ln\" x1=\"24\" y1=\"226\" x2=\"196\" y2=\"226\" style=\"stroke-width:3\"/><text class=\"tm\" x=\"190\" y=\"218\" text-anchor=\"end\">1er obstacle</text> <rect class=\"frs\" x=\"230\" y=\"10\" width=\"200\" height=\"230\" rx=\"12\"/><text class=\"tr\" x=\"330\" y=\"32\" text-anchor=\"middle\">INTERDIT</text> <line class=\"ln dash mut\" x1=\"244\" y1=\"110\" x2=\"416\" y2=\"110\"/><text class=\"tm\" x=\"246\" y=\"102\">axe de déplacement</text> <circle class=\"fr\" cx=\"290\" cy=\"190\" r=\"8\"/><text class=\"tm\" x=\"290\" y=\"214\" text-anchor=\"middle\">amarrage trop bas</text> <circle cx=\"370\" cy=\"110\" r=\"9\" class=\"mk\"/><path class=\"ln\" style=\"stroke-width:3\" d=\"M370 119 V150 M370 130 L356 142 M370 130 L384 142 M370 150 L360 170 M370 150 L380 170\"/> <path class=\"ln sr\" style=\"stroke-width:2.5\" d=\"M290 190 Q330 160 366 114\"/> <text class=\"tr\" x=\"330\" y=\"236\" text-anchor=\"middle\">facteur de chute &gt; 1</text> </svg>", "cap": "Les points d'amarrage restent toujours au-dessus ou au niveau de l'axe de déplacement. La longueur de corde après le dernier renvoi reste plus courte que la hauteur libre, élasticité comprise. Sur un toit : amarrage sur la charpente, tuiles retirées."}, {"id": "exterieur", "m": "lspcc", "title": "Sauvetage par l'extérieur", "svg": "<svg viewBox=\"0 0 450 300\" role=\"img\" aria-label=\"Coupe de façade. Ancrage fiable à l'intérieur, descendeur en 8 en point fixe, corde qui passe par la fenêtre jusqu'à la victime puis jusqu'au point de réception au sol. La longueur utile va du dispositif de freinage au point de réception et doit rester inférieure à la longueur de corde.\"> <defs><marker id=\"c9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk\"/></marker></defs> <rect class=\"bx\" x=\"40\" y=\"20\" width=\"200\" height=\"262\" rx=\"4\"/> <line class=\"ln thin mut\" x1=\"40\" y1=\"110\" x2=\"240\" y2=\"110\"/><line class=\"ln thin mut\" x1=\"40\" y1=\"196\" x2=\"240\" y2=\"196\"/> <rect class=\"fs\" x=\"226\" y=\"56\" width=\"16\" height=\"44\"/> <rect class=\"navyf\" x=\"70\" y=\"72\" width=\"22\" height=\"34\" rx=\"3\"/><text class=\"tm\" x=\"81\" y=\"66\" text-anchor=\"middle\">ancrage</text> <circle class=\"fy\" cx=\"130\" cy=\"90\" r=\"10\"/><text class=\"tb\" x=\"130\" y=\"94\" text-anchor=\"middle\" style=\"font-size:11px\">8</text><text class=\"tm\" x=\"130\" y=\"124\" text-anchor=\"middle\">frein en</text><text class=\"tm\" x=\"130\" y=\"138\" text-anchor=\"middle\">point fixe</text> <path class=\"ln sy\" style=\"stroke-width:3.5\" d=\"M92 88 H120 M140 90 C190 90 230 70 250 78 L264 150 L264 262\"/> <circle class=\"mk\" cx=\"264\" cy=\"150\" r=\"8\"/><path class=\"ln\" style=\"stroke-width:3\" d=\"M264 158 V182 M264 166 L25 /* ================= MOTEUR DE PLANIFICATION =================
   Phase 1 Apprentissage : du départ à J-14, les notions sont réparties sur les jours d'étude.
   Phase 2 Consolidation : J-13 à J-7, modules faibles, oraux, examen blanc à J-7.
   Phase 3 Dernière ligne droite : J-6 à J-1, volume dégressif, J-1 léger.
   Les jours de repos choisis sont respectés. Une notion non faite glisse au jour d'étude suivant. */
function buildPlan(){
  const st=fromIso(S.set.start), ex=fromIso(S.set.exam); const span=ex-st;
  let learnEnd=ex-14, consEnd=ex-7;
  if(span<28){learnEnd=st+Math.max(1,Math.floor(span*0.55)); consEnd=st+Math.floor(span*0.8);}
  const days=[];
  for(let d=st;d<=ex;d++){
    const phase=d===ex?"exam":d===ex-1?"eve":d>consEnd?"final":d>learnEnd?"cons":"learn";
    const rest=phase!=="exam"&&phase!=="eve"&&S.set.rest.includes(wd(d));
    days.push({d,phase,rest,chunks:[],tasks:[]});
  }
  const learnDays=days.filter(x=>x.phase==="learn"&&!x.rest);
  const pool=learnDays.length?learnDays:days.filter(x=>!x.rest&&x.phase!=="exam");
  // poids des notions selon le temps disponible : pondération par longueur
  if(pool.length) CHUNKS.forEach((c,k)=>{const idx=Math.min(pool.length-1,Math.floor(k*pool.length/CHUNKS.length)); pool[idx].chunks.push(c.id)});
  days.forEach(x=>{
    if(x.rest) return;
    if(x.phase==="learn"){x.tasks=x.chunks.length?["learn","cards","quiz"]:["cards","quiz"]; if(learnDays.indexOf(x)%3===2) x.tasks.push("oral"); if(x===pool[pool.length-1]&&learnDays.length) x.bilan=true;}
    else if(x.phase==="cons"){x.tasks=["cards","quiz","oral"]; if(x.d===consEnd) x.tasks=["exam","cards"];}
    else if(x.phase==="final"){x.tasks=["cards","oral"]; if(x.d<=ex-4) x.tasks.push("quiz");}
    else if(x.phase==="eve"){x.tasks=["cards"]; x.note="20 minutes maximum. Relis tes fiches les plus faibles, prépare ton sac, couche-toi tôt.";}
    else if(x.phase==="exam"){x.tasks=[]; x.note="10 minutes au réveil : chaîne de commandement et compte rendu à voix haute. Puis tu y vas.";}
  });
  return {days,st,ex,learnEnd,consEnd};
}

function chunksToday(){const t=today(); const out=[];

/* ================= RÉPÉTITION ESPACÉE =================
   Algorithme type SM-2, intervalles plafonnés pour que chaque carte repasse avant l'examen. */
const unlockedMods=()=>{const m=new Set(); Object.keys(S.learned).forEach(id=>m.add(id.split(":")[0]));
  const t=today(); if(t>PLAN.learnEnd) MODS.forEach(x=>m.add(x.id)); return m};
function newPerDay(){return Math.max(6,Math.round(S.set.min/3))}
function cardQueue(limitNew){
  const t=today(), um=unlockedMods();
  let due=Q.filter(x=>S.cards[x.id]&&S.cards[x.id].due<=t);
  const leftD=fromIso(S.set.exam)-t;
  if(leftD<=1){due=due.sort((a,b)=>((S.cards[b.id].lapses||0)-(S.cards[a.id].lapses||0))||(S.cards[a.id].ef-S.cards[b.id].ef)).slice(0,20)}
  const introducedToday=Object.values(S.cards).filter(c=>c.first===t).length;
  const room=leftD<=3?0:Math.max(0,(limitNew??newPerDay())-introducedToday);
  const fresh=[]; const allOpen=t>PLAN.learnEnd;
  ORDER.forEach(m=>{const qm=Q.filter(x=>x.m===m); const cm=CHUNKS.filter(c=>c.m===m); const lm=cm.filter(c=>S.learned[c.id]).length;
    const allowed=allOpen?qm.length:(cm.length?Math.ceil(qm.length*lm/cm.length):0); const intro=qm.filter(x=>S.cards[x.id]).length;
    qm.filter(x=>!S.cards[x.id]).slice(0,Math.max(0,allowed-intro)).forEach(x=>fresh.push(x))});
  fresh.splice(room);
  return {due:shuffle(due),fresh};
}
function schedule(x,g){
  const t=today(), left=Math.max(1,fromIso(S.set.exam)-t);
  const c=S.cards[x.id]||{r:0,iv:0,ef:2.5,first:t};
  if(g===1){c.r=0;c.iv=0;c.ef=Math.max(1.3,c.ef-0.2);c.due=t;c.lapses=(c.lapses||0)+1}
  else{
    if(c.r===0) c.iv=g===2?1:g===3?2:4;
    else if(c.r===1) c.iv=g===2?2:g===3?4:7;
    else c.iv=Math.round(c.iv*(g===2?1.2:g===3?c.ef:c.ef*1.3));
    c.ef=Math.max(1.3,c.ef+(g===2?-0.15:g===4?0.1:0));
    c.r++;
    const hs=[...x.id].reduce((a,ch)=>a+ch.charCodeAt(0),0)%4;
    let cap=left<=7?(g>=3?Math.max(1,left-2-hs):Math.max(1,Math.min(2,left-1))):Math.max(1,left-2);
    c.iv=Math.max(1,Math.min(c.iv,cap)); c.due=t+c.iv;
  }
  c.lr=t; S.cards[x.id]=c; save();
}

/* ================= MAÎTRISE ================= */
/* maîtrise = probabilité de rappel estimée aujourd'hui (cartes), réussite récente aux quiz, notions vues */
function recall(c){if(!c) return 0; const t=today(); const lr=c.lr??((c.due??t)-(c.iv||0)); const st=Math.max(1,(c.iv||1)*1.6+(c.r||0)-(c.lapses||0)*0.5); return Math.exp(-Math.max(0,t-lr)/st)}
function mastery(mid){
  const qs=Q.filter(x=>x.m===mid); if(!qs.length) return null;
  const rc=qs.reduce((a,x)=>a+recall(S.cards[x.id]),0)/qs.length;
  const ans=qs.filter(x=>S.q[x.id]); const qa=ans.length?ans.filter(x=>S.q[x.id].last).length/qs.length:0;
  const cm=CHUNKS.filter(c=>c.m===mid); const ls=cm.length?cm.filter(c=>S.learned[c.id]).length/cm.length:0;
  return Math.round((0.6*rc+0.25*qa+0.15*ls)*100);
}
function readiness(){let w=0,s=0; MODS.forEach(m=>{const n=Q.filter(x=>x.m===m.id).length; if(!n) return; s+=(mastery(m.id)??0)*n; w+=n}); let r=w?s/w:0;
  const ex=S.exams[S.exams.length-1]; if(ex&&today()-ex.d<=10) r=0.7*r+0.3*ex.p; return Math.round(r)}

async function scheduleReminders(){const ln=LN(); if(!ln) return;
  try{const pend=await ln.getPending(); if(pend.notifications.length) await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});

    const ex=fromIso(S.set.exam), t=today(), list=[];

      const u=dateOf(d); const at=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),h,0,0); if(at<=new Date()) continue; const left=ex-d;
      list.push({id:1000+d%100000,title:left===1?"Demain, le grade":"Objectif Caporal · J-"+left,body:left===1?"20 minutes de révision maximum, puis repos. Tu es prêt.":left<=7?"Dernière ligne droite : ta séance t'attend.":"Ta séance du jour t'attend. Quelques minutes suffisent.",schedule:{at,allowWhileIdle:true}})}

function countUp(el,to,ms){if(!el)return; if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=to+"%";return} const t0=performance.now(); const step=n=>{const k=Math.min(1,(n-t0)/ms); const e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e)+"%"; if(k<1) requestAnimationFrame(step)}; requestAnimationFrame(step)}
function toast(m){const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200)}
let LASTDAY=today(); setInterval(()=>{if(today()!==LASTDAY){LASTDAY=today(); if(!stack.length) render()}},60000);

function modsTable(){return MODS.map(m=>{const v=mastery(m.id);return `<div class="mod" style="--mc:${modCol(m.id)}"><span><span class="dot"></span>${esc(m.t)}</span><span class="meter"><i class="${v<40?"low":v<75?"mid":""}" style="width:${v||0}%"></i></span><span class="pct">${v==null?"-":v+"%"}</span></div>`}).join("")}
function startTask(k,x){
  if(k==="cards") startCards(false);
  if(k==="learn") startLearn();
  if(k==="quiz"){const learnedToday=[...new Set(chunksToday().map(c=>c.id.split(":")[0]))];
    let pool; if(x.phase==="learn"){const um=unlockedMods(); pool=Q.filter(q=>learnedToday.includes(q.m)&&um.has(q.m)); if(pool.length<6) pool=Q.filter(q=>um.has(q.m)); if(!pool.length) pool=Q;}
    else{const w=weakMods().slice(0,3).map(o=>o.m); pool=Q.filter(q=>w.includes(q.m)).concat(errorsList());}
    startQuiz(pool,10,"Quiz du jour","quiz")}
  if(k==="oral") startOral(pickOral(),"oral");
  if(k==="exam") startExam("exam");
}
function pickOral(){const w=weakMods().map(o=>o.m); return ORAL.map((o,i)=>({i,s:(S.oral[i]?.best??-1)/o.c.length+(w.indexOf(o.m)/20)})).sort((a,b)=>a.s-b.s)[0].i}

  openSession("Nouvelles notions",v=>{
    const c=CH[list[i].id];

    <div class="qhead"><span class="lbl">Notion</span><span class="lbl">${i+1} / ${list.length}</span></div>
    ${pbar(Math.max(0,i-1)/list.length,i/list.length)}
    <article class="card reader" id="reader"><div class="rbody">${c.html}</div></article>
    ${schemasOf(c.m).length?`<details class="sch-more"><summary>Voir le schéma du module</summary>${schemasOf(c.m).map(schemaFig).join("")}</details>`:""}
    <p class="muted" style="font-size:14.5px">Méthode : lis une fois, cache, récite à voix haute, vérifie. C'est l'effort de rappel qui ancre.</p>
    <div class="sticky-cta"><button class="btn" id="hide">Cacher et réciter</button><button class="btn primary" id="ok">${i+1<list.length?"Appris, suivante":"Appris, terminer"}</button></div>`;
    $("#hide").onclick=()=>{const r=$("#reader"); r.classList.toggle("hide"); $("#hide").textContent=r.classList.contains("hide")?"Vérifier":"Cacher et réciter"};
    $("#ok").onclick=()=>{S.learned[c.id]=today(); save(); i++;
      if(i<list.length) drawSession(); else{markTask("learn"); closeSession(false);
        const mods=[...new Set(list.map(l=>CH[l.id].m))]; const pool=Q.filter(q=>mods.includes(q.m));
        if(pool.length) setTimeout(()=>{toast("Vérification immédiate : 3 questions sur ce que tu viens d'apprendre"); startQuiz(pool,3,"Vérification immédiate")},480); else toast("Notions apprises. Leurs cartes entrent dans tes révisions.")}};
  });

/* ================= CARTES ================= */
let CS=null;
function startCards(free,modFilter){
  let {due,fresh}=cardQueue(free?newPerDay()+10:undefined);
  if(modFilter){due=due.filter(x=>x.m===modFilter);fresh=Q.filter(x=>x.m===modFilter&&!S.cards[x.id]).slice(0,15)}
  let list=due.concat(fresh);
  if(!list.length&&free){list=shuffle(Q.filter(x=>S.cards[x.id])).slice(0,15)}
  if(!list.length){toast(unlockedMods().size?"Aucune carte due aujourd'hui":"Apprends d'abord une notion pour débloquer ses cartes"); if(!free) {markTask("cards"); vToday()} return}
  CS={list,i:0,flip:false,n:list.length,good:0,task:!free&&!modFilter?"cards":null};
  openSession("Révisions",drawCard);
}
/* QCM chronométré : la vitesse de bonne réponse classe la carte (acquis / en cours / non acquis) */
const CAT={ok:{l:"Acquis",c:"ok"},mid:{l:"En cours d'acquisition",c:"mid"},ko:{l:"Non acquis",c:"ko"}};
function catOf(c){if(!c) return null; if(c.cat) return c.cat; return c.r===0?"ko":(c.ef>=2.5&&c.r>=2?"ok":"mid")}
function catCounts(){const n={ok:0,mid:0,ko:0,new:0}; Q.forEach(x=>{const k=catOf(S.cards[x.id]); n[k||"new"]++}); return n}
function qBudget(x){const ch=x.q.length+x.o.reduce((a,o)=>a+o.length,0); return Math.round(Math.max(12,Math.min(30,10+ch/30)))}
function drawCard(v){
  const c=CS; clearInterval(TIMER); const x=c.list[c.i];
  if(!c.res) c.res={ok:0,mid:0,ko:0,koList:[]};
  if(!x){const r=c.res, tot=r.ok+r.mid+r.ko||1;
    v.innerHTML=`<div class="card"><h2>Révisions terminées</h2><p class="muted">${c.n} carte${c.n>1?"s":""}. Chacune reviendra au bon moment selon ta vitesse.</p>

    if(c.task) markTask("cards"); $("#end").onclick=()=>closeSession(false); return}
  if(!x.idx) x.idx=x.o.length===2?[0,1]:shuffle(x.o.map((_,i)=>i));
  const B=qBudget(x), t0=Date.now(); let done=false; const T_OK=B*0.7;
  v.innerHTML=`<div class="qhead cq"><span class="lbl mname">${esc(modName(x.m))}${S.cards[x.id]?"":" · nouvelle"}</span><span class="lbl cnt">${Math.min(c.i+1,c.list.length)}/${c.list.length}</span></div>
  <div class="tstat ok" id="ts"><span class="tpill" id="tp">Acquis si tu réponds maintenant</span><b class="tsec" id="clk2">${B}</b></div>
  <div class="tbar2" aria-hidden="true"><i id="tb"></i></div>
  <p class="qtext">${esc(x.q)}</p>
  <div class="opts">${x.idx.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(x.o[oi])}</span></button>`).join("")}</div><div id="fb"></div>`;
  const finish=(oi)=>{if(done) return; done=true; clearInterval(TIMER);
    const el=(Date.now()-t0)/1000, ok=oi===x.a; let g,k;
    if(!ok){g=1;k="ko"} else if(el<=B*0.35){g=4;k="ok"} else if(el<=T_OK){g=3;k="ok"} else {g=2;k="mid"}
    schedule(x,g); S.cards[x.id].cat=k; const st=S.q[x.id]||{ok:0,ko:0}; ok?st.ok++:st.ko++; st.last=ok; S.q[x.id]=st; save();
    if(!c.seen) c.seen={}; if(!c.seen[x.id]){c.seen[x.id]=1; c.res[k]++; if(k==="ko") c.res.koList.push(x)}
    if(g===1) c.list.push({...x,idx:null});
    buzz(ok?12:[30,40,30]); $("#ts").classList.add("stop");
    v.querySelectorAll(".opt").forEach(o=>{const j=+o.dataset.oi;o.disabled=true;if(j===x.a)o.classList.add("good");else if(j===oi)o.classList.add("bad")});
    const due=S.cards[x.id].due-today(); const nxt=g===1?"revient en fin de série":"prochaine révision dans "+due+" j";
    $("#fb").innerHTML=`<div class="verdict ${k}"><b>${oi==null?"Temps écoulé · ":""}${CAT[k].l}</b><span>${ok?el.toFixed(1)+" s · ":""}${nxt}</span></div>
    <div class="expl">${ok?"":"<b>Réponse : "+esc(x.o[x.a])+".</b> "}${esc(x.e||"")}</div>
    <button class="btn primary block" id="nx" style="margin-top:12px">${c.i+1<c.list.length?"Carte suivante":"Voir le bilan"}</button>`;
    $("#nx").onclick=()=>{c.i++;drawCard(v)}; $("#nx").focus()};
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>finish(+b.dataset.oi));
  const tick=()=>{const el=(Date.now()-t0)/1000, left=Math.max(0,B-el), st=el<=T_OK?"ok":"mid";
    const ts=$("#ts"), tb=$("#tb"); if(!ts) return;
    if(ts.dataset.st!==st){ts.dataset.st=st; ts.className="tstat "+st; $("#tp").textContent=st==="ok"?"Acquis si tu réponds maintenant":"En cours d'acquisition"; if(st==="mid") buzz(6)}
    $("#clk2").textContent=Math.ceil(left); tb.style.transform="scaleX("+(left/B)+")";
    if(left<=0) finish(null)};
  tick(); TIMER=setInterval(tick,100);
}
function prev(x,g){let iv;
  const c=S.cards[x.id]?{...S.cards[x.id]}:{r:0,iv:0,ef:2.5}; const left=Math.max(1,fromIso(S.set.exam)-today());
  if(c.r===0) iv=g===2?1:g===3?2:4; else if(c.r===1) iv=g===2?2:g===3?4:7; else iv=Math.round(c.iv*(g===2?1.2:g===3?c.ef:c.ef*1.3));
  const cap=left<=7?Math.max(1,Math.min(3,left-1)):Math.max(1,left-2); iv=Math.max(1,Math.min(iv,cap)); return iv===1?"1 j":iv+" j"}

/* ================= QUIZ ================= */
let QZ=null;
function startQuiz(pool,n,label,task){
  const seen=new Set(); pool=pool.filter(x=>!seen.has(x.id)&&seen.add(x.id));
  if(!pool.length){toast("Aucune question disponible");return}
  const qs=shuffle(pool).slice(0,Math.min(n,pool.length)).map(x=>({...x,idx:x.o.length===2?[0,1]:shuffle(x.o.map((_,i)=>i))}));
  QZ={qs,i:0,good:0,label,task,answered:false};
  openSession(label,drawQ);
}
function drawQ(v){
  const z=QZ,x=z.qs[z.i];
  if(!x){const p=Math.round(z.good/z.qs.length*100); if(z.task) markTask(z.task);
    v.innerHTML=`<div class="card score-card ${p>=80?"great":""}"><span class="lbl">${esc(z.label)}</span><div class="row" style="margin:14px 0"><div class="score" id="sc" style="color:var(${p>=80?"--ok":p>=60?"--warn":"--ko"})">0%</div><div>${z.good} sur ${z.qs.length}<br><span class="muted">${p>=80?"Niveau examen.":p>=60?"Presque. Relis la fiche concernée ce soir.":"Relis la fiche puis refais ce quiz demain."}</span></div></div><button class="btn primary block" id="end">Terminer</button></div>`;
    $("#end").onclick=()=>closeSession(false); countUp($("#sc"),p,700); if(p>=80) buzz([20,60,20]); return}
  v.innerHTML=`<div class="qhead"><span class="lbl">${esc(modName(x.m))}</span><span class="lbl">${z.i+1} / ${z.qs.length}</span></div>
  ${pbar(Math.max(0,z.i-1)/z.qs.length,z.i/z.qs.length)}
  <p class="qtext">${esc(x.q)}</p>
  <div class="opts">${x.idx.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(x.o[oi])}</span></button>`).join("")}</div><div id="fb"></div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(z.answered)return; z.answered=true; const oi=+b.dataset.oi, ok=oi===x.a;
    const st=S.q[x.id]||{ok:0,ko:0}; ok?st.ok++:st.ko++; st.last=ok; S.q[x.id]=st; if(ok)z.good++; save(); buzz(ok?14:[40,50,40]);
    v.querySelectorAll(".opt").forEach(o=>{const k=+o.dataset.oi;o.disabled=true;if(k===x.a)o.classList.add("good");else if(k===oi)o.classList.add("bad")});
    $("#fb").innerHTML=`<div class="expl"><b style="color:var(${ok?"--ok":"--ko"})">${ok?"Juste.":"Faux."}</b> ${ok?"":"Réponse : "+esc(x.o[x.a])+". "}${esc(x.e||"")}</div><button class="btn primary block" id="nx" style="margin-top:12px">${z.i+1<z.qs.length?"Question suivante":"Voir le résultat"}</button>`;
    $("#nx").onclick=()=>{z.i++;z.answered=false;drawQ(v)}; $("#nx").focus()});
}

/* ================= EXAMEN BLANC ================= */
let EX=null,TIMER=null;
function startExam(task){
  const qs=shuffle(Q).slice(0,40).map(x=>({...x,idx:x.o.length===2?[0,1]:shuffle(x.o.map((_,i)=>i)),pick:null}));
  EX={qs,i:0,end:Date.now()+30*60e3,done:false,task:task||null};
  openSession("Examen blanc",drawExam);
}
function drawExam(v){
  const e=EX; clearInterval(TIMER);
  if(e.done){const good=e.qs.filter(q=>q.pick===q.a).length,p=Math.round(good/e.qs.length*100);
    if(!e.saved){e.qs.forEach(x=>{const st=S.q[x.id]||{ok:0,ko:0}; const ok=x.pick===x.a; ok?st.ok++:st.ko++; st.last=ok; S.q[x.id]=st}); S.exams.push({d:today(),p}); e.saved=true; if(e.task) markTask("exam"); save()}
    const bad=e.qs.filter(q=>q.pick!==q.a);
    v.innerHTML=`<div class="card score-card ${p>=80?"great":""}"><span class="lbl">Examen blanc</span><div class="row" style="margin:12px 0"><div class="score" id="sc" data-p="${p}" style="color:var(${p>=80?"--ok":p>=60?"--warn":"--ko"})">${p}%</div><div>${good} / 40<br><span class="muted">${bad.length} erreur${bad.length>1?"s":""} ajoutée${bad.length>1?"s":""} à « Mes erreurs »</span></div></div></div>
    ${bad.map(x=>`<div class="card"><span class="lbl">${esc(modName(x.m))}</span><p style="font-weight:600;margin-top:6px">${esc(x.q)}</p><p style="color:var(--ko)">Ta réponse : ${x.pick==null?"aucune":esc(x.o[x.pick])}</p><p style="color:var(--ok)">Bonne réponse : ${esc(x.o[x.a])}</p></div>`).join("")}
    <button class="btn primary block" id="end">Terminer</button>`;
    $("#end").onclick=()=>closeSession(false); countUp($("#sc"),p,900); return}
  const x=e.qs[e.i]; const tick=()=>{const s=Math.max(0,Math.round((e.end-Date.now())/1000)); const el=$("#clk"); if(el) el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(s<=0){e.done=true;clearInterval(TIMER);drawExam(v);return false}};
  v.innerHTML=`<div class="qhead"><span class="lbl">Question ${e.i+1} / 40</span><span class="lbl" id="clk"></span></div>
  ${pbar(Math.max(0,e.i-1)/40,e.i/40)}
  <p class="qtext">${esc(x.q)}</p>
  <div class="opts">${x.idx.map((oi,k)=>`<button class="opt ${x.pick===oi?"pick":""}" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(x.o[oi])}</span></button>`).join("")}</div>
  <div class="sticky-cta"><button class="btn" id="pv" ${e.i?"":"disabled"}>Précédente</button><button class="btn primary" id="nx">${e.i<39?"Suivante":"Rendre la copie"}</button></div>`;
  if(tick()===false) return; TIMER=setInterval(tick,1000);
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{x.pick=+b.dataset.oi; buzz(8); v.querySelectorAll(".opt").forEach(o=>o.classList.toggle("pick",o===b))});
  $("#pv").onclick=()=>{e.i--;drawExam(v)};
  $("#nx").onclick=()=>{if(e.i<39){e.i++;drawExam(v)}else{e.done=true;drawExam(v)}};
}

function vSettings(){
  const s=S.set;
  $("#view").innerHTML=`<div><h2>${CHV}Ton rythme</h2><p class="muted">Le programme se recalcule dès que tu changes un réglage. Ta progression est conservée.</p></div>
  <div class="card stack">
    <div class="field"><label for="ex">Date de l'examen</label><input type="date" id="ex" value="${s.exam}"></div>
    <div class="field"><label for="sd">Début de la préparation</label><input type="date" id="sd" value="${s.start}"><span class="hint">Les notions sont réparties entre ces deux dates, jusqu'à J-14.</span></div>
  </div>
  <div class="card stack"><div class="field"><span class="lbl2">Temps par jour</span><div class="seg" id="mins">${[20,30,45,60,90].map(m=>`<button aria-pressed="${s.min===m}" data-m="${m}">${m} min</button>`).join("")}</div><span class="hint">Règle le nombre de nouvelles cartes par jour (${newPerDay()} actuellement).</span></div></div>
  <div class="card stack"><div class="field"><span class="lbl2">Jours de repos</span><div class="seg" id="rest">${[1,2,3,4,5,6,0].map(d=>`<button aria-pressed="${s.rest.includes(d)}" data-d="${d}">${JOURS[d]}</button>`).join("")}</div><span class="hint">Tes gardes ou tes journées chargées. Aucune notion n'y est placée.</span></div></div>
  ${NATIVE?`<div class="card stack"><div class="field"><span class="lbl2">Rappel quotidien</span><div class="seg" id="rm">${[["off","Aucun"],[7,"7 h"],[12,"12 h"],[18,"18 h"],[19,"19 h"],[20,"20 h"],[21,"21 h"]].map(([v,l])=>`<button aria-pressed="${v==="off"?s.remind==null:s.remind===v}" data-v="${v}">${l}</button>`).join("")}</div><span class="hint">Une notification par jour d'étude, jamais les jours de repos, jusqu'à la veille de l'examen.</span></div></div>`:""}
  <div class="card stack"><div class="field"><span class="lbl2">Vibrations</span><div class="seg" id="hp"><button aria-pressed="${s.haptic!==false}" data-h="1">Activées</button><button aria-pressed="${s.haptic===false}" data-h="0">Coupées</button></div><span class="hint">Un retour au doigt à chaque réponse. Android uniquement.</span></div></div>
  <div class="card stack"><div class="field"><span class="lbl2">Apparence</span><div class="seg" id="th">${[["system","Auto"],["light","Clair"],["dark","Sombre"]].map(([k,l])=>`<button aria-pressed="${s.theme===k}" data-t="${k}">${l}</button>`).join("")}</div></div></div>
  <div class="card stack"><h3 style="margin:0">Sauvegarde</h3><p class="muted" style="font-size:14.5px">Ta progression est stockée sur ce téléphone. Copie ce code de temps en temps dans tes notes : il permet de tout restaurer, ou de passer sur un autre appareil.</p>
    <button class="btn" id="cp">Copier mon code de sauvegarde</button>
    <div class="field"><label for="imp">Restaurer depuis un code</label><textarea id="imp" placeholder="Colle ici ton code de sauvegarde"></textarea></div>
    <button class="btn" id="ld">Restaurer</button></div>
  <div class="card stack"><h3 style="margin:0">Repartir de zéro</h3><p class="muted" style="font-size:14.5px">Efface toute ta progression. Tes réglages sont gardés.</p><button class="btn" id="rs">Tout effacer</button><div id="rsc" hidden class="row"><span>Sûr ?</span><button class="btn primary" id="rsy">Oui, effacer</button><button class="btn" id="rsn">Annuler</button></div></div>
  <div class="card stack"><h3 style="margin:0">Crédits photos</h3><ul class="credits" style="margin:0;padding-left:18px">${CREDITS.map(c=>`<li><b>${esc(c[0])}</b> : ${esc(c[1])}, ${esc(c[2])}, via Wikimedia Commons</li>`).join("")}</ul><p class="muted" style="font-size:13.5px;margin:0">Illustrations et insigne dessinés pour l'application.</p></div>
  <p class="foot">Objectif Caporal, conçu par Formylia 360. Contenu basé sur le référentiel de formation chef d'équipe.</p>`;
  const upd=()=>{PLAN=buildPlan();save();scheduleReminders()};
  $("#ex").onchange=e=>{if(e.target.value&&fromIso(e.target.value)>fromIso(s.start)){s.exam=e.target.value;upd();toast("Programme recalculé")}else{e.target.value=s.exam;toast("La date d'examen doit suivre la date de début")}};
  $("#sd").onchange=e=>{if(e.target.value&&fromIso(e.target.value)<fromIso(s.exam)){s.start=e.target.value;upd();toast("Programme recalculé")}else{e.target.value=s.start;toast("La date de début doit précéder l'examen")}};
  $("#mins").onclick=e=>{const b=e.target.closest("button");if(!b)return;s.min=+b.dataset.m;upd();vSettings()};
  $("#rest").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=+b.dataset.d; s.rest=s.rest.includes(d)?s.rest.filter(x=>x!==d):s.rest.concat(d); if(s.rest.length>4){s.rest=s.rest.filter(x=>x!==d);toast("4 jours de repos maximum");} upd();vSettings()};
  if($("#rm")) $("#rm").onclick=async e=>{const b=e.target.closest("button");if(!b)return; s.remind=b.dataset.v==="off"?null:+b.dataset.v; save(); await scheduleReminders(); toast(s.remind==null?"Rappel désactivé":"Rappel programmé à "+s.remind+" h"); vSettings()};
  $("#hp").onclick=e=>{const b=e.target.closest("button");if(!b)return;s.haptic=b.dataset.h==="1";save();if(s.haptic)buzz(15);vSettings()};
  $("#th").onclick=e=>{const b=e.target.closest("button");if(!b)return;s.theme=b.dataset.t;applyTheme();save();vSettings()};
  $("#cp").onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const fallback=()=>{$("#imp").value=code;$("#imp").select();toast("Code affiché : sélectionne-le et copie-le")};
    try{navigator.clipboard.writeText(code).then(()=>toast("Code copié. Colle-le dans tes notes."),fallback)}catch(e){fallback()}};
  $("#ld").onclick=()=>{let o; try{o=JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim()))))}catch(e){toast("Code invalide : vérifie qu'il est complet");return}
    const isD=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
    if(!o||typeof o!=="object"||!o.set||typeof o.set!=="object"||!isD(o.set.exam)||!isD(o.set.start)){toast("Code invalide : il ne vient pas d'Objectif Caporal");return}
    const n=Object.assign(JSON.parse(JSON.stringify(DEF)),o); n.set=Object.assign({},DEF.set,o.set); if(!Array.isArray(n.set.rest)) n.set.rest=[];
    ["learned","cards","q","done","oral","rate"].forEach(k=>{if(!n[k]||typeof n[k]!=="object") n[k]={}}); if(!Array.isArray(n.exams)) n.exams=[];
    const keep=S; S=n; try{PLAN=buildPlan()}catch(e){S=keep; PLAN=buildPlan(); toast("Code invalide : données incohérentes");return}
    save(); applyTheme(); scheduleReminders(); toast("Progression restaurée"); vSettings()};
  $("#rs").classList.add("danger");
  $("#rs").onclick=()=>{$("#rsc").hidden=false};
  $("#rsn").onclick=()=>{$("#rsc").hidden=true};
  $("#rsy").onclick=()=>{const set=S.set; S=JSON.parse(JSON.stringify(DEF)); S.set=set; save(); scheduleReminders(); toast("Progression effacée"); go("today")};
}

/* ================= DÉMARRAGE ================= */
let r0="today"; try{r0=localStorage.getItem(KEY+"-r")||"today"}catch(e){}
go(["today","plan","fiches","train","settings"].includes(r0)?r0:"today");
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!stack.length) render()});

</script>

<script>
const APP_VERSION="2026.11.22-3";
/* Vérifie version.json : si une nouvelle version est en ligne, recharge l'appli. */
function checkVersion(){fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.version&&j.version!==APP_VERSION) location.reload()}).catch(()=>{})}
setTimeout(checkVersion,3000);
/* PWA : mise à jour automatique. Le service worker charge toujours la dernière version en ligne,
   et recharge l'appli dès qu'une nouvelle version est publiée sur GitHub. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){check(); checkVersion()}});
    setInterval(check,30*60*1000);
  });
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded) return; reloaded=true; location.reload()});
}
</script>
</body></html>
